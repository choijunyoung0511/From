<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>독후감 결과 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .letter-wrap {
            max-width: 560px;
            margin: 40px auto;
            border-radius: 16px;
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            font-family: 'Nanum Myeongjo', serif;
            line-height: 2;
            font-size: 15px;
            color: #333;
            white-space: pre-wrap;
        }

        /* 기본 5종 */
        .paper-1  { background: linear-gradient(135deg, #FFF8F0, #F5E6D3); }
        .paper-2  { background: linear-gradient(135deg, #FFE4E8, #FFBFCC); }
        .paper-3  { background: linear-gradient(135deg, #1E3A5F, #2E5A8F); color: white; }
        .paper-4  { background: linear-gradient(135deg, #E0F5F0, #B8EAE0); }
        .paper-5  { background: linear-gradient(135deg, #F5F0E8, #E8DCC8); }

        /* 계절 4종 */
        .paper-6  { background: linear-gradient(135deg, #FFD6E7, #FFAFD2, #FFC8A2); }
        .paper-7  { background: linear-gradient(135deg, #E8F4FD, #AED6F1, #85C1E9); }
        .paper-8  { background: linear-gradient(135deg, #FDEBD0, #F0B27A, #E59866); color: #5D2E0C; }
        .paper-9  { background: linear-gradient(135deg, #EAF2FF, #D6E8FF, #C3DEFF); }

        /* 감정 3종 */
        .paper-10 { background: linear-gradient(135deg, #FFF0F5, #FFD6E8, #FFC2E0); }
        .paper-11 { background: linear-gradient(135deg, #2C3E50, #3D5166, #4A6278); color: white; }
        .paper-12 { background: linear-gradient(135deg, #F8F9FA, #E8F5E9, #C8E6C9); }

        .btn-row { display: flex; gap: 10px; max-width: 560px; margin: 20px auto; }
    </style>
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>


<div class="page-container">
    <h2 style="text-align:center; color:#6071E3; margin-bottom:28px; font-family:'Nanum Myeongjo',serif;">
        AI 독후감 생성 완료 ✉️
    </h2>

    <div class="letter-wrap" th:classappend="'paper-' + ${review.paperId}">
        <p th:text="${review.aiContent}">독후감 내용이 여기에 표시됩니다.</p>
    </div>

    <div class="btn-row">
        <a th:href="@{/review}" class="btn btn-outline" style="flex:1; text-align:center;">새 독후감 만들기</a>
        <a th:href="@{/}" class="btn btn-primary" style="flex:1; text-align:center;">홈으로</a>
    </div>
</div>
</body>
</html>
