<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서비스 시작 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: url('/images/library.png') center/cover no-repeat;
            font-family: 'Nanum Gothic', sans-serif;
        }

        /* 헤더 */
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            height: 72px;
            background: white;
            border-bottom: 1px solid #eee;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .main-logo {
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        .main-nav {
            display: flex;
            align-items: center;
            gap: 48px;
        }
        .main-nav a {
            color: #333;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .main-nav a:hover { color: #6071E3; }
        .header-logout-btn {
            background: #6071E3;
            border: none;
            color: white;
            padding: 8px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s;
        }
        .header-logout-btn:hover { background: #4f5fd4; }

        /* 콘텐츠 */
        .hero-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 72px);
            padding: 40px 20px;
            text-align: center;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
            margin-bottom: 48px;
            font-family: 'Nanum Myeongjo', serif;
            line-height: 1.4;
        }

        /* 카드 3개 */
        .service-cards {
            display: flex;
            gap: 24px;
            margin-bottom: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .service-card {
            background: white;
            border-radius: 16px;
            padding: 32px 28px;
            width: 240px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .service-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.2);
        }
        .service-card img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 8px;
        }
        .service-card-title {
            font-size: 15px;
            font-weight: 700;
            color: #333;
        }

        /* 안내 문구 */
        .subtitle {
            font-size: 17px;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            margin-bottom: 32px;
            font-weight: 600;
        }

        /* 뒤로 가기 버튼 */
        .back-btn {
            background: #6071E3;
            color: white;
            border: none;
            padding: 16px 60px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(96,113,227,0.4);
        }
        .back-btn:hover {
            background: #4f5fd4;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<!-- 헤더 -->
<header class="main-header">
    <a href="/" class="main-logo">
        <img th:src="@{/images/logo.png}" alt="from" style="height: 60px;">
    </a>
    <div style="display:flex; align-items:center; gap:48px;">
        <nav class="main-nav">
            <a th:href="@{/book/register}">책 등록</a>
            <a th:href="@{/ranking}">랭킹</a>
            <a th:href="@{/review}">독후감</a>
            <a th:href="@{/user/mypage}">마이페이지</a>
        </nav>
        <a th:href="@{/user/logout}" class="header-logout-btn">로그아웃</a>
    </div>
</header>

<!-- 메인 콘텐츠 -->
<div class="hero-content">
    <h1 class="welcome-title">
        <span th:text="${session.loginUser.name}">사용자</span>님 어서오세요!<br>
        어떤 서비스를 이용하고 싶으신가요?
    </h1>

    <div class="service-cards">
        <a th:href="@{/book/register}" class="service-card">
            <img th:src="@{/images/image 8.png}" alt="책 등록하기">
            <div class="service-card-title">책 등록하기</div>
        </a>
        <a th:href="@{/ranking}" class="service-card">
            <img th:src="@{/images/image 11.png}" alt="랭킹 보기">
            <div class="service-card-title">랭킹 보기</div>
        </a>
        <a th:href="@{/review}" class="service-card">
            <img th:src="@{/images/image 10.png}" alt="AI 독후감 생성">
            <div class="service-card-title">AI 독후감 생성</div>
        </a>
    </div>

    <p class="subtitle">책을 등록하여 ai독후감을 생성해보세요!</p>

    <a href="javascript:history.back()" class="back-btn">뒤로 가기</a>
</div>

</body>
</html>
