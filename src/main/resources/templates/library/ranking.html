<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서관 인기대출도서 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        body { background: #F4F5F9; font-family: 'Jua', sans-serif; }
        .lib-container { max-width: 880px; margin: 40px auto; padding: 0 20px 60px; }
        .lib-section { margin-bottom: 40px; }
        .lib-section-title {
            font-size: 22px; font-weight: 700; color: #1E3A5F;
            margin-bottom: 18px; padding-bottom: 10px;
            border-bottom: 2px solid #6071E3;
            font-family: 'Hi Melody', cursive;
        }

        /* 인기대출도서 카드 그리드 */
        .popular-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
        }
        .popular-card {
            background: white; border-radius: 14px; padding: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            display: flex; flex-direction: column;
        }
        .popular-rank {
            font-size: 13px; font-weight: 700; color: #6071E3; margin-bottom: 8px;
        }
        .popular-cover {
            width: 100%; height: 170px; object-fit: cover;
            border-radius: 8px; margin-bottom: 10px;
            background: linear-gradient(135deg,#e8e0d5,#d4c9bd);
        }
        .popular-cover-placeholder {
            width: 100%; height: 170px; border-radius: 8px; margin-bottom: 10px;
            background: linear-gradient(135deg,#e8e0d5,#d4c9bd);
            display: flex; align-items: center; justify-content: center; font-size: 32px;
        }
        .popular-title {
            font-size: 13px; font-weight: 700; color: #1A1A2E; line-height: 1.4;
            margin-bottom: 4px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .popular-author { font-size: 11px; color: #7A7899; margin-bottom: 6px; }
        .popular-loan { font-size: 11px; color: #9999B8; margin-top: auto; }

        .empty-state {
            text-align: center; padding: 60px 20px;
            background: white; border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            color: #aaa; font-size: 14px;
        }
    </style>
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="lib-container">

    <!-- 인기대출도서 -->
    <section class="lib-section">
        <div class="lib-section-title">📚 전국 인기대출도서 TOP 10</div>

        <div th:if="${popularBooks != null and !popularBooks.isEmpty()}" class="popular-grid">
            <div class="popular-card" th:each="b : ${popularBooks}">
                <div class="popular-rank" th:text="'' + ${b.ranking()} + '위'">1위</div>
                <img th:if="${b.bookImageUrl() != null and !b.bookImageUrl().isEmpty()}"
                     th:src="${b.bookImageUrl()}" class="popular-cover" alt="표지"
                     onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'popular-cover-placeholder',textContent:'📚'}))">
                <div th:unless="${b.bookImageUrl() != null and !b.bookImageUrl().isEmpty()}" class="popular-cover-placeholder">📚</div>
                <div class="popular-title" th:text="${b.bookName()}">도서명</div>
                <div class="popular-author" th:text="${b.authors()}">저자</div>
                <div class="popular-loan" th:text="'대출 ' + ${b.loanCount()} + '회'">대출 0회</div>
            </div>
        </div>

        <div th:if="${popularBooks == null or popularBooks.isEmpty()}" class="empty-state">
            현재 도서 정보를 불러올 수 없습니다.
        </div>
    </section>

</div>
</body>
</html>
