<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스타일 선택 · FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .step-bar { display: flex; justify-content: center; align-items: center; padding: 32px 0 0; gap: 0; }
        .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .step-circle { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #ddd; background: white; color: #aaa; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
        .step.active .step-circle { background: #6071E3; border-color: #6071E3; color: white; }
        .step.done .step-circle   { background: #a0a8f0; border-color: #a0a8f0; color: white; }
        .step-label { font-size: 12px; color: #aaa; white-space: nowrap; }
        .step.active .step-label  { color: #6071E3; font-weight: 700; }
        .step-line { width: 80px; height: 2px; background: #ddd; margin-bottom: 22px; }
        .step-line.done { background: #a0a8f0; }

        .style-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 8px; }
        .style-card { border: 2px solid #E0D5CC; border-radius: 12px; padding: 20px 12px; text-align: center; cursor: pointer; transition: all 0.2s; background: #FAFAFA; position: relative; }
        .style-card:hover  { border-color: #6071E3; background: #f5f5ff; }
        .style-card.selected { border-color: #6071E3; background: #eef0fd; }
        .style-card.selected::after { content: '✓'; position: absolute; top: 6px; right: 10px; font-size: 12px; color: #6071E3; font-weight: 700; }
        input[type="radio"] { display: none; }
        .style-emoji { font-size: 32px; display: block; margin-bottom: 8px; }
        .style-name  { font-weight: 700; font-size: 15px; margin-bottom: 4px; color: #333; }
        .style-desc  { font-size: 12px; color: #999; line-height: 1.4; }

        .btn-row { display: flex; gap: 12px; margin-top: 28px; }
        .btn-back { flex: 0 0 120px; }
    </style>
</head>
<body>

<header class="main-header">
    <a class="main-logo" th:href="@{/}"><img th:src="@{/images/logo.png}" alt="FROM"></a>
    <nav class="main-nav">
        <a th:href="@{/book/register}">책 등록</a>
        <a th:href="@{/ranking}">랭킹</a>
        <a th:href="@{/review}" class="active">독후감</a>
        <a th:href="@{/mypage}">마이페이지</a>
        <a th:href="@{/user/logout}" class="header-logout-btn">로그아웃</a>
    </nav>
</header>

<div class="step-bar">
    <div class="step done"><div class="step-circle">✓</div><span class="step-label">사진 업로드</span></div>
    <div class="step-line done"></div>
    <div class="step active"><div class="step-circle">2</div><span class="step-label">스타일 선택</span></div>
    <div class="step-line"></div>
    <div class="step"><div class="step-circle">3</div><span class="step-label">결과 확인</span></div>
</div>

<div class="page-container">
    <div class="form-container">
        <h2 class="form-title">어떤 장면을 만들어볼까요?</h2>
        <p style="text-align:center; color:#888; margin-bottom:28px; font-size:15px;">
            📚 <span th:text="${bookTitle}">책 제목</span>
        </p>

        <div class="form-group">
            <label>책 장면 설명</label>
            <textarea id="sceneInput" class="form-control" maxlength="300" rows="3"
                      placeholder="예) 주인공이 빗속에서 우산을 쓰고 걷는 장면..."></textarea>
            <span class="success-msg" style="text-align:right; display:block;"><span id="charCnt">0</span> / 300</span>
        </div>

        <div class="form-group">
            <label>이미지 스타일</label>
            <div class="style-grid">
                <label th:each="opt : ${styleOptions}" class="style-card" th:data-value="${opt.value}">
                    <input type="radio" name="styleRadio" th:value="${opt.value}">
                    <span class="style-emoji"
                          th:text="${opt.value == 'watercolor'   ? '🎨' :
                                     opt.value == 'cartoon'      ? '✏️' :
                                     opt.value == 'realistic'    ? '📷' :
                                     opt.value == 'oil_painting' ? '🖼️' :
                                     opt.value == 'sketch'       ? '✒️' : '🔮'}">🎨</span>
                    <p class="style-name" th:text="${opt.label}">스타일</p>
                    <p class="style-desc" th:text="${opt.description}">설명</p>
                </label>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn btn-outline btn-back" onclick="history.back()">← 이전</button>
            <button class="btn btn-primary" style="flex:1" id="generateBtn" disabled>✨ 이미지 생성하기</button>
        </div>
    </div>
</div>

<!-- 로딩 모달 -->
<div class="modal-overlay" id="loadingModal">
    <div class="modal-box">
        <p style="font-size:32px; margin-bottom:12px;">⏳</p>
        <p>이미지를 생성하고 있어요<br>2~3분 정도 소요됩니다.</p>
    </div>
</div>

<script>
    const sceneInput   = document.getElementById('sceneInput');
    const charCnt      = document.getElementById('charCnt');
    const generateBtn  = document.getElementById('generateBtn');
    const styleCards   = document.querySelectorAll('.style-card');
    const loadingModal = document.getElementById('loadingModal');
    let selectedStyle  = '';

    sceneInput.addEventListener('input', () => { charCnt.textContent = sceneInput.value.length; updateBtn(); });

    styleCards.forEach(card => {
        card.addEventListener('click', () => {
            styleCards.forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedStyle = card.dataset.value;
            card.querySelector('input[type="radio"]').checked = true;
            updateBtn();
        });
    });

    function updateBtn() { generateBtn.disabled = !(sceneInput.value.trim() && selectedStyle); }

    generateBtn.addEventListener('click', async () => {
        generateBtn.disabled = true;
        loadingModal.classList.add('show');

        const formData = new FormData();
        formData.append('scene', sceneInput.value.trim());
        formData.append('style', selectedStyle);

        try {
            const res  = await fetch('/image/generate', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.success && data.imageId) {
                window.location.href = `/image/result/${data.imageId}`;
            } else {
                loadingModal.classList.remove('show');
                alert('이미지 생성 실패: ' + (data.errorMessage || '알 수 없는 오류'));
                generateBtn.disabled = false;
                generateBtn.textContent = '✨ 이미지 생성하기';
            }
        } catch (e) {
            loadingModal.classList.remove('show');
            alert('오류가 발생했습니다. 다시 시도해주세요.');
            generateBtn.disabled = false;
            generateBtn.textContent = '✨ 이미지 생성하기';
        }
    });
</script>
</body>
</html>
