<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 이미지 완성 · FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        *{box-sizing:border-box}
        body{background:linear-gradient(160deg,#F8F6FF 0%,#FFF8F4 100%);min-height:100vh;position:relative;overflow-x:hidden}
        body::before{
            content:'';position:fixed;top:-160px;left:50%;transform:translateX(-50%);
            width:800px;height:600px;
            background:radial-gradient(ellipse,rgba(96,113,227,.07) 0%,transparent 68%);
            pointer-events:none;z-index:0;
        }

        /* ── Wizard ── */
        .wizard{display:flex;align-items:center;justify-content:center;padding:36px 20px 0;gap:0;position:relative;z-index:1}
        .wiz-step{display:flex;flex-direction:column;align-items:center;gap:8px}
        .wiz-circle{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;transition:all .3s}
        .wiz-step.done .wiz-circle{background:#6071E3;color:#fff;box-shadow:0 0 0 4px rgba(96,113,227,.15)}
        .wiz-label{font-size:11px;font-weight:700;letter-spacing:.3px;color:#6071E3}
        .wiz-line{width:72px;height:2px;margin-bottom:30px;border-radius:2px;background:linear-gradient(90deg,#6071E3,#8B59C7)}

        /* ── Hero ── */
        .hero{text-align:center;padding:36px 20px 0;position:relative;z-index:1}
        .hero-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(96,113,227,.09);color:#6071E3;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:6px 16px;border-radius:100px;margin-bottom:14px}
        .hero h2{font-size:26px;font-weight:800;color:#1A1A2E;margin:0 0 10px;line-height:1.3}
        .hero p{color:#7A7899;font-size:14px;margin:0}

        /* ── Artwork Card ── */
        .artwork-card{max-width:600px;margin:28px auto 60px;position:relative;z-index:1}

        /* ── Compare Slider ── */
        .compare-section{
            border-radius:20px;overflow:hidden;
            box-shadow:0 24px 64px rgba(0,0,0,.15),0 0 0 1px rgba(96,113,227,.08);
            margin-bottom:24px;
        }
        .compare-wrap{
            position:relative;height:420px;cursor:col-resize;user-select:none;
            background:#1a1410;
        }
        .compare-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
        .compare-after{z-index:1}
        .compare-before{z-index:2;clip-path:inset(0 50% 0 0);transition:none}
        .compare-label{
            position:absolute;top:14px;z-index:15;
            background:rgba(0,0,0,.52);backdrop-filter:blur(4px);
            color:#fff;font-size:12px;font-weight:700;padding:5px 14px;border-radius:100px;
            pointer-events:none;
        }
        .compare-label.left{left:14px}
        .compare-label.right{right:14px}
        .compare-handle{
            position:absolute;top:0;left:50%;height:100%;width:44px;
            transform:translateX(-50%);z-index:20;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            pointer-events:none;
        }
        .handle-line{position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-50%);background:rgba(255,255,255,.85);box-shadow:0 0 8px rgba(0,0,0,.3)}
        .handle-btn{
            width:40px;height:40px;border-radius:50%;background:#fff;
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 4px 16px rgba(0,0,0,.25);color:#6071E3;font-weight:900;font-size:13px;
            pointer-events:all;cursor:col-resize;z-index:21;position:relative;
            border:2px solid rgba(96,113,227,.2);
        }
        .compare-hint{text-align:center;font-size:12px;color:#A0A0B8;margin-bottom:0;padding:10px 0 16px;background:#fff}

        /* Single image fallback */
        .single-section{display:none;border-radius:20px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.15);margin-bottom:24px}
        .single-section img{width:100%;max-height:500px;object-fit:contain;display:block;background:#1a1410}

        /* ── Info Area ── */
        .info-card{background:#fff;border-radius:20px;padding:24px 28px;box-shadow:0 8px 32px rgba(96,113,227,.08);margin-bottom:20px}
        .info-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
        .artwork-title{font-size:17px;font-weight:800;color:#1A1A2E}
        .badge-wrap{display:flex;gap:8px;flex-wrap:wrap}
        .badge{
            display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:100px;
            font-size:13px;font-weight:700;
        }
        .badge-book{background:linear-gradient(135deg,rgba(96,113,227,.1),rgba(139,89,199,.1));color:#5060CC;border:1px solid rgba(96,113,227,.2)}
        .badge-style{background:rgba(253,121,168,.1);color:#C2185B;border:1px solid rgba(253,121,168,.25)}

        /* ── Buttons ── */
        .btn-row{display:flex;gap:10px;margin-bottom:12px}
        .btn-dl{
            flex:1;padding:14px;border:none;border-radius:12px;
            background:linear-gradient(135deg,#6071E3,#8B59C7);color:#fff;
            font-size:15px;font-weight:700;cursor:pointer;transition:all .25s;
            display:flex;align-items:center;justify-content:center;gap:6px;
        }
        .btn-dl:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(96,113,227,.4)}
        .btn-share{
            flex:1;padding:14px;border:1.5px solid #E4E1F0;border-radius:12px;
            background:#fff;color:#555577;font-size:15px;font-weight:700;cursor:pointer;
            transition:all .25s;display:flex;align-items:center;justify-content:center;gap:6px;
        }
        .btn-share:hover{border-color:#6071E3;color:#6071E3;background:rgba(96,113,227,.04)}
        .btn-regen{
            width:100%;padding:13px;border:1.5px solid #E4E1F0;border-radius:12px;
            background:#fff;color:#888;font-size:14px;font-weight:600;cursor:pointer;
            transition:all .25s;margin-bottom:10px;
        }
        .btn-regen:hover{border-color:#6071E3;color:#6071E3}
        .link-mypage{display:block;text-align:center;font-size:13px;color:#A0A0B8;text-decoration:none;padding:4px 0}
        .link-mypage:hover{color:#6071E3}

        /* ── Toast ── */
        .toast{
            position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);
            background:#1A1A2E;color:#fff;padding:12px 24px;border-radius:100px;
            font-size:14px;font-weight:600;z-index:9999;
            transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .35s;opacity:0;
        }
        .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

        @media(max-width:640px){
            .artwork-card{margin:24px 16px 40px}
            .compare-wrap{height:280px}
            .wiz-line{width:44px}
            .info-header{flex-direction:column;align-items:flex-start}
        }
    </style>
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<!-- Wizard -->
<div class="wizard">
    <div class="wiz-step done"><div class="wiz-circle">✓</div><span class="wiz-label">사진 업로드</span></div>
    <div class="wiz-line"></div>
    <div class="wiz-step done"><div class="wiz-circle">✓</div><span class="wiz-label">스타일 선택</span></div>
    <div class="wiz-line"></div>
    <div class="wiz-step done"><div class="wiz-circle">✓</div><span class="wiz-label">결과 확인</span></div>
</div>

<!-- Hero -->
<div class="hero">
    <div class="hero-tag">🌟 AI Artwork</div>
    <h2>당신이 책 속 주인공이 되었습니다</h2>
    <p>AI가 당신만의 독서 장면을 완성했습니다<br>슬라이더를 움직여 변환 전후를 비교해보세요</p>
</div>

<!-- Hidden imageId -->
<div id="imageIdData" th:data-id="${imageId}" style="display:none"></div>

<!-- Artwork Card -->
<div class="artwork-card">

    <!-- Before/After Slider (inputImageUrl 있을 때) -->
    <div class="compare-section" id="compareSection" style="display:none">
        <div class="compare-wrap" id="compareWrap">
            <img id="afterImg"  class="compare-img compare-after"  src="" alt="AI 생성 결과">
            <img id="beforeImg" class="compare-img compare-before" src="" alt="원본 사진">
            <div class="compare-label left">원본</div>
            <div class="compare-label right">AI 변환</div>
            <div class="compare-handle" id="compareHandle">
                <div class="handle-line"></div>
                <div class="handle-btn">⟺</div>
            </div>
        </div>
        <p class="compare-hint">◀ 슬라이더를 드래그해서 비교해보세요 ▶</p>
    </div>

    <!-- 단독 결과 이미지 (inputImageUrl 없을 때) -->
    <div class="single-section" id="singleSection">
        <img id="singleImg" src="" alt="AI 생성 결과">
    </div>

    <!-- Info & Buttons -->
    <div class="info-card">
        <div class="info-header">
            <span class="artwork-title">나의 책 속 장면</span>
            <div class="badge-wrap">
                <span class="badge badge-book">📚 <span id="infoBook">-</span></span>
                <span class="badge badge-style">🎨 <span id="infoStyle">-</span></span>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn-dl" id="btnDownload">⬇ 이미지 저장</button>
            <button class="btn-share" id="btnShare">🔗 링크 복사</button>
        </div>
        <button class="btn-regen" onclick="window.location.href='/image/create'">🔄 다시 만들기</button>
        <a class="link-mypage" th:href="@{/mypage}">내 작품 전체 보기 →</a>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    /* ── Load detail ── */
    const imageId = document.getElementById('imageIdData').dataset.id;
    let resultUrl = '';

    if (imageId && imageId !== 'undefined') {
        fetch(`/image/detail/${imageId}`)
            .then(r => r.json())
            .then(data => {
                resultUrl = data.imageUrl || '';
                const inputUrl = data.inputImageUrl || '';

                if (inputUrl && resultUrl) {
                    // Before / After slider
                    document.getElementById('beforeImg').src = inputUrl;
                    document.getElementById('afterImg').src  = resultUrl;
                    document.getElementById('compareSection').style.display = 'block';
                } else {
                    // Single result
                    document.getElementById('singleImg').src = resultUrl;
                    document.getElementById('singleSection').style.display = 'block';
                }

                document.getElementById('infoBook').textContent  = data.bookTitle || '-';
                document.getElementById('infoStyle').textContent = styleLabel(data.style);
            })
            .catch(() => {
                document.getElementById('singleSection').style.display = 'block';
                document.getElementById('singleImg').alt = '이미지를 불러올 수 없습니다.';
            });
    }

    function styleLabel(val) {
        const map = {watercolor:'수채화', cartoon:'만화/애니메이션', realistic:'사실적', oil_painting:'유화', sketch:'스케치', fantasy:'판타지'};
        return map[val] || val || '-';
    }

    /* ── Compare Slider ── */
    const compareWrap = document.getElementById('compareWrap');
    const beforeImg   = document.getElementById('beforeImg');
    const handle      = document.getElementById('compareHandle');
    let dragging = false;

    function moveSplit(clientX) {
        const rect = compareWrap.getBoundingClientRect();
        let pct = ((clientX - rect.left) / rect.width) * 100;
        pct = Math.max(5, Math.min(95, pct));
        beforeImg.style.clipPath = `inset(0 ${(100 - pct).toFixed(1)}% 0 0)`;
        handle.style.left = pct + '%';
    }

    compareWrap.addEventListener('mousedown', e => { dragging = true; moveSplit(e.clientX); e.preventDefault(); });
    document.addEventListener('mousemove',  e => { if (dragging) moveSplit(e.clientX); });
    document.addEventListener('mouseup',    () => dragging = false);
    compareWrap.addEventListener('touchstart', e => { dragging = true; moveSplit(e.touches[0].clientX); }, {passive:true});
    document.addEventListener('touchmove',    e => { if (dragging) moveSplit(e.touches[0].clientX); }, {passive:true});
    document.addEventListener('touchend',     () => dragging = false);

    /* ── Download ── */
    document.getElementById('btnDownload').addEventListener('click', async () => {
        if (!resultUrl) return;
        try {
            const res  = await fetch(resultUrl);
            const blob = await res.blob();
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href = url; a.download = 'from-character.png'; a.click();
            URL.revokeObjectURL(url);
        } catch {
            window.open(resultUrl, '_blank');
        }
    });

    /* ── Share (copy link) ── */
    document.getElementById('btnShare').addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(resultUrl || window.location.href);
            showToast('🔗 링크가 복사되었습니다!');
        } catch {
            showToast('링크를 복사할 수 없습니다.');
        }
    });

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2400);
    }
</script>
</body>
</html>
