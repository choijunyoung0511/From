<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 독후감 기록 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: #f5f5f5; font-family: 'Nanum Myeongjo', serif; }

        .main-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; height: 72px; background: white; border-bottom: 1px solid #eee;
        }
        .main-nav { display: flex; align-items: center; gap: 48px; }
        .main-nav a { color: #333; text-decoration: none; font-size: 15px; font-weight: 500; }
        .main-nav a:hover { color: #6071E3; }
        .header-logout-btn {
            background: #6071E3; border: none; color: white;
            padding: 8px 24px; border-radius: 20px; cursor: pointer;
            font-size: 14px; font-weight: 700; text-decoration: none;
        }

        .content { max-width: 700px; margin: 40px auto; padding: 0 20px; }

        .page-title {
            font-size: 22px; font-weight: 700; color: #1E3A5F;
            margin-bottom: 24px; padding-bottom: 12px;
            border-bottom: 2px solid #6071E3;
        }

        .review-card {
            background: white; border-radius: 12px; padding: 24px;
            margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            transition: transform 0.15s;
        }
        .review-card:hover { transform: translateY(-2px); }

        .review-book { font-size: 16px; font-weight: 700; color: #333; margin-bottom: 6px; }
        .review-author { font-size: 13px; color: #888; margin-bottom: 12px; }
        .review-meta { display: flex; gap: 16px; font-size: 13px; color: #aaa; }
        .review-status {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
        }
        .status-sent { background: #e8f5e9; color: #388e3c; }
        .status-pending { background: #fff3e0; color: #f57c00; }

        .empty-state {
            text-align: center; padding: 80px 20px;
            background: white; border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state p { color: #aaa; font-size: 15px; }

        .back-link {
            display: inline-block; margin-bottom: 20px;
            color: #6071E3; text-decoration: none; font-size: 14px;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<header class="main-header">
    <a href="/"><img th:src="@{/images/logo.png}" alt="from" style="height:60px;"></a>
    <div style="display:flex; align-items:center; gap:48px;">
        <nav class="main-nav">
            <a th:href="@{/book/register}">책 등록</a>
            <a th:href="@{/ranking}">랭킹</a>
            <a th:href="@{/review}">독후감</a>
            <a th:href="@{/user/mypage}">마이페이지</a>
        </nav>
        <a th:href="@{/user/logout}" class="header-logout-btn">로그아웃</a>
    </div>
</header>

<div class="content">
    <a th:href="@{/user/mypage}" class="back-link">← 마이페이지로</a>
    <h2 class="page-title">📖 내 독후감 기록</h2>

    <div th:if="${reviews != null and !reviews.isEmpty()}">
        <div class="review-card" th:each="r : ${reviews}">
            <div class="review-book" th:text="${r.bookTitle}">책 제목</div>
            <div class="review-author" th:text="'저자: ' + ${r.bookAuthor}">저자</div>
            <div class="review-meta">
                <span th:text="'발송일: ' + ${r.deliveryDate}"></span>
                <span th:text="'발송시간: ' + ${r.deliveryTime}"></span>
                <span class="review-status"
                      th:classappend="${r.isSent == 1} ? 'status-sent' : 'status-pending'"
                      th:text="${r.isSent == 1} ? '발송 완료' : '발송 대기'">
                </span>
            </div>
        </div>
    </div>

    <div th:if="${reviews == null or reviews.isEmpty()}" class="empty-state">
        <div class="icon">✉️</div>
        <p>아직 생성한 독후감이 없어요.<br>책을 읽고 미래의 나에게 편지를 보내보세요!</p>
    </div>
</div>

</body>
</html>
