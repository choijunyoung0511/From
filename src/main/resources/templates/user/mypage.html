<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #f5f5f5;
            font-family: 'Nanum Myeongjo', serif;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            height: 72px;
            background: white;
            border-bottom: 1px solid #eee;
        }
        .main-nav { display: flex; align-items: center; gap: 48px; }
        .main-nav a { color: #333; text-decoration: none; font-size: 15px; font-weight: 500; }
        .main-nav a:hover, .main-nav a.active { color: #6071E3; font-weight: 700; }
        .header-logout-btn {
            background: #6071E3; border: none; color: white;
            padding: 8px 24px; border-radius: 20px; cursor: pointer;
            font-size: 14px; font-weight: 700; text-decoration: none;
        }

        .mypage-container { max-width: 500px; margin: 40px auto; padding: 0 20px; }

        .user-card {
            background: white; border-radius: 16px; padding: 32px;
            margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .user-info h3 { font-size: 20px; font-weight: 700; color: #1E3A5F; margin-bottom: 8px; }
        .info-row { display: flex; gap: 12px; margin-bottom: 10px; align-items: center; }
        .info-label { font-size: 12px; color: #999; min-width: 40px; }
        .info-value { font-size: 14px; color: #333; font-weight: 500; }

        .menu-list { list-style: none; }
        .menu-list li { border-bottom: 1px solid #f0ebe6; }
        .menu-list li:last-child { border-bottom: none; }
        .menu-list a, .menu-list button {
            display: block; width: 100%; padding: 16px 0;
            text-decoration: none; color: #333; font-size: 15px;
            background: none; border: none; cursor: pointer; text-align: left;
            transition: color 0.2s;
        }
        .menu-list a:hover, .menu-list button:hover { color: #6071E3; font-weight: 600; }
        .menu-list .danger { color: #e74c3c; }
        .menu-list .danger:hover { color: #c0392b; }

        .home-link {
            display: block; text-align: center; margin-top: 16px;
            color: #888; font-size: 13px; text-decoration: none;
        }
        .home-link:hover { color: #6071E3; }
    </style>
</head>
<body>

<header class="main-header">
    <a href="/">
        <img th:src="@{/images/logo.png}" alt="from" style="height: 60px;">
    </a>
    <div style="display:flex; align-items:center; gap:48px;">
        <nav class="main-nav">
            <a th:href="@{/book/register}">책 등록</a>
            <a th:href="@{/ranking}">랭킹</a>
            <a th:href="@{/review}">독후감</a>
            <a th:href="@{/user/mypage}" class="active">마이페이지</a>
        </nav>
        <a th:href="@{/user/logout}" class="header-logout-btn">로그아웃</a>
    </div>
</header>

<div class="mypage-container">
    <!-- 유저 정보 카드 -->
    <div class="user-card">
        <div class="user-info">
            <h3 th:text="${session.loginUser.name}">이름</h3>
        </div>
        <div style="margin-top: 16px;">
            <div class="info-row">
                <span class="info-label">이메일</span>
                <span class="info-value" th:text="${session.loginUser.email}">이메일</span>
            </div>
            <div class="info-row">
                <span class="info-label">아이디</span>
                <span class="info-value" th:text="${session.loginUser.username}">아이디</span>
            </div>
        </div>
    </div>

    <!-- 메뉴 -->
    <div class="user-card">
        <ul class="menu-list">
            <li><a th:href="@{/user/mypage/reviews}">내 독후감 기록 조회</a></li>
            <li><a th:href="@{/user/mypage/changePassword}">비밀번호 변경</a></li>
            <li><button class="danger" onclick="showDeleteModal()">회원 탈퇴</button></li>
        </ul>
        <a th:href="@{/}" class="home-link">홈으로 돌아가기</a>
    </div>
</div>

<!-- 회원탈퇴 모달 -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
        <p>회원을 탈퇴하려면 비밀번호를 입력해주세요.</p>
        <div style="margin: 16px 0;">
            <input type="password" id="delete-password" class="form-control" placeholder="비밀번호">
            <span class="error-msg" id="delete-error"></span>
        </div>
        <button class="btn btn-danger btn-block" onclick="deleteAccount()">회원 탈퇴</button>
        <button class="btn btn-outline btn-block" style="margin-top:8px;" onclick="closeDeleteModal()">취소</button>
    </div>
</div>

<!-- 결과 모달 -->
<div class="modal-overlay" id="resultModal">
    <div class="modal-box">
        <p id="result-msg"></p>
        <button class="btn btn-primary" id="result-btn">확인</button>
    </div>
</div>

<script>
    function showDeleteModal() { document.getElementById('deleteModal').classList.add('show'); }
    function closeDeleteModal() {
        document.getElementById('deleteModal').classList.remove('show');
        document.getElementById('delete-password').value = '';
        document.getElementById('delete-error').textContent = '';
    }

    function deleteAccount() {
        const password = document.getElementById('delete-password').value;
        const error = document.getElementById('delete-error');
        error.textContent = '';
        if (!password) { error.textContent = '비밀번호를 입력해주세요.'; return; }

        fetch('/user/mypage/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `password=${encodeURIComponent(password)}`
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                closeDeleteModal();
                document.getElementById('result-msg').textContent = '회원탈퇴가 완료되었습니다.';
                document.getElementById('result-btn').onclick = () => window.location.href = '/';
                document.getElementById('resultModal').classList.add('show');
            } else {
                error.textContent = '비밀번호가 일치하지 않습니다.';
            }
        });
    }
</script>
</body>
</html>
