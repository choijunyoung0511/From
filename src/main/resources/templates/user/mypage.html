<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #f5f5f5;
            font-family: 'Jua', sans-serif;
        }

        .mypage-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }

        .tab-menu {
            display: flex; gap: 8px; margin-bottom: 24px;
            background: white; border-radius: 12px; padding: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .tab-btn {
            flex: 1; padding: 14px 20px; border: none; background: transparent;
            color: #666; font-size: 16px; font-weight: 600; border-radius: 8px;
            cursor: pointer; transition: all 0.2s; font-family: 'Jua', sans-serif;
        }
        .tab-btn.active { background: #6071E3; color: white; }
        .tab-btn:hover:not(.active) { background: #f0f0f0; color: #333; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .user-card {
            background: white; border-radius: 16px; padding: 32px;
            margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .user-info h3 { font-size: 24px; font-weight: 700; color: #1E3A5F; margin-bottom: 12px; }
        .info-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
        .info-label { font-size: 14px; color: #999; min-width: 60px; }
        .info-value { font-size: 16px; color: #333; font-weight: 500; }

        .menu-list { list-style: none; }
        .menu-list li { border-bottom: 1px solid #f0ebe6; }
        .menu-list li:last-child { border-bottom: none; }
        .menu-list button {
            display: block; width: 100%; padding: 18px 0;
            text-decoration: none; color: #333; font-size: 16px;
            background: none; border: none; cursor: pointer; text-align: left;
            transition: color 0.2s; font-family: 'Jua', sans-serif;
        }
        .menu-list button:hover { color: #6071E3; font-weight: 600; }
        .menu-list .danger { color: #e74c3c; }
        .menu-list .danger:hover { color: #c0392b; }

        .home-link {
            display: block; text-align: center; margin-top: 16px;
            color: #888; font-size: 14px; text-decoration: none;
        }
        .home-link:hover { color: #6071E3; }

        .page-title {
            font-size: 24px; font-weight: 700; color: #1E3A5F;
            margin-bottom: 24px; padding-bottom: 12px;
            border-bottom: 2px solid #6071E3;
            font-family: 'Hi Melody', cursive;
        }

        .review-card {
            background: white; border-radius: 12px; padding: 24px;
            margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            transition: transform 0.15s;
        }
        .review-card:hover { transform: translateY(-2px); }
        .review-book { font-size: 18px; font-weight: 700; color: #333; margin-bottom: 6px; }
        .review-author { font-size: 14px; color: #888; margin-bottom: 12px; }
        .review-meta { display: flex; gap: 16px; font-size: 14px; color: #aaa; flex-wrap: wrap; }
        .review-status {
            display: inline-block; padding: 4px 12px; border-radius: 20px;
            font-size: 13px; font-weight: 600;
        }
        .status-sent { background: #e8f5e9; color: #388e3c; }
        .status-pending { background: #fff3e0; color: #f57c00; }

        .empty-state {
            text-align: center; padding: 80px 20px;
            background: white; border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        }
        .empty-state .icon { font-size: 56px; margin-bottom: 16px; }
        .empty-state p { color: #aaa; font-size: 16px; line-height: 1.6; }

        .card {
            background: white; border-radius: 16px; padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .card h2 {
            font-size: 24px; font-weight: 700; color: #1E3A5F;
            margin-bottom: 24px; padding-bottom: 12px;
            border-bottom: 2px solid #6071E3;
            font-family: 'Hi Melody', cursive;
        }

        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 14px; color: #666; margin-bottom: 8px; font-weight: 600; }
        .form-control:focus { border-color: #6071E3; }
        .hint { font-size: 13px; color: #aaa; margin-top: 6px; display: block; }
        .error-msg { display: block; color: #e53935; font-size: 13px; margin-top: 6px; min-height: 18px; }

        /* ── 모달 공통 ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.45); z-index: 500;
            align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: white; border-radius: 16px; padding: 36px 32px;
            max-width: 400px; width: 90%; box-shadow: 0 16px 48px rgba(0,0,0,0.2);
            text-align: center;
        }
        .modal-box p { font-size: 16px; color: #333; margin-bottom: 20px; line-height: 1.6; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-outline { background: white; color: #666; border: 1.5px solid #ddd; }
        .btn-outline:hover { border-color: #6071E3; color: #6071E3; }
        .btn-block { display: block; width: 100%; }

        @media (max-width: 768px) {
            .tab-menu { flex-direction: column; gap: 4px; }
        }

        /* ── 독서 대시보드 탭 ── */
        .db { --accent:#5b7cf8; --accent2:#7c9cff; --accent-light:#eef1fe; --db-bg:#f5f6fa; --border:#e4e7f0; --text2:#6b7280; --text3:#adb5c9; --radius:14px; --shadow:0 2px 12px rgba(91,124,248,0.08); }
        .db-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        .db-card { background:white; border:1px solid var(--border); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow); }
        .db-card-full { grid-column:1 / -1; }
        .db-card-title { font-size:12px; font-family:monospace; color:var(--text3); letter-spacing:1.2px; text-transform:uppercase; margin-bottom:18px; }
        .db-stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; grid-column:1 / -1; }
        .db-stat-item { background:white; border:1px solid var(--border); border-radius:var(--radius); padding:20px; text-align:center; box-shadow:var(--shadow); }
        .db-stat-item .num { font-size:32px; font-weight:700; font-family:monospace; color:var(--accent); line-height:1; margin-bottom:8px; }
        .db-stat-item .lbl { font-size:12px; color:var(--text2); }
        .db-grass-wrap { overflow-x:auto; padding-bottom:4px; }
        .db-grass-months { display:flex; margin-bottom:6px; padding-left:28px; }
        .db-grass-month-label { font-size:11px; color:var(--text3); font-family:monospace; }
        .db-grass-body { display:flex; gap:4px; align-items:flex-start; }
        .db-grass-days { display:flex; flex-direction:column; gap:3px; margin-right:4px; }
        .db-grass-day-label { font-size:10px; color:var(--text3); font-family:monospace; height:13px; line-height:13px; width:24px; text-align:right; }
        .db-grass-cols { display:flex; gap:3px; }
        .db-grass-col { display:flex; flex-direction:column; gap:3px; }
        .db-grass-cell { width:13px; height:13px; border-radius:3px; cursor:pointer; transition:transform 0.15s; }
        .db-grass-cell:hover { transform:scale(1.3); }
        .db-grass-cell.l0 { background:#edf0f7; } .db-grass-cell.l1 { background:#c8e6c9; }
        .db-grass-cell.l2 { background:#81c784; } .db-grass-cell.l3 { background:#4caf50; }
        .db-grass-cell.l4 { background:#2e7d32; }
        .db-grass-legend { display:flex; align-items:center; gap:4px; margin-top:12px; justify-content:flex-end; }
        .db-grass-legend span { font-size:11px; color:var(--text3); font-family:monospace; }
        .db-legend-cell { width:13px; height:13px; border-radius:3px; }
        .db-chart-container { position:relative; height:210px; }
        .db-book-list { display:flex; flex-direction:column; gap:10px; }
        .db-book-item { display:flex; align-items:center; gap:12px; padding:12px; background:var(--db-bg); border-radius:10px; border:1px solid var(--border); transition:border-color 0.2s; }
        .db-book-item:hover { border-color:var(--accent); }
        .db-book-cover { width:36px; height:50px; border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:18px; background:var(--accent-light); }
        .db-book-info { flex:1; min-width:0; }
        .db-book-title { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:4px; }
        .db-book-author { font-size:12px; color:var(--text2); }
        .db-book-date { font-size:11px; color:var(--text3); font-family:monospace; flex-shrink:0; }
        .db-goal-section { display:flex; flex-direction:column; gap:18px; }
        .db-goal-item { display:flex; flex-direction:column; gap:8px; }
        .db-goal-header { display:flex; justify-content:space-between; align-items:center; }
        .db-goal-label { font-size:13px; color:var(--text2); font-weight:500; }
        .db-goal-val { font-size:13px; font-family:monospace; color:var(--accent); }
        .db-progress-bar { height:8px; background:var(--db-bg); border-radius:99px; overflow:hidden; border:1px solid var(--border); }
        .db-progress-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width 1s cubic-bezier(0.4,0,0.2,1); width:0%; }
        .db-goal-input-row { display:flex; gap:8px; margin-top:4px; }
        .db-goal-input { flex:1; background:var(--db-bg); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:13px; outline:none; transition:border-color 0.2s; font-family:inherit; }
        .db-goal-input:focus { border-color:var(--accent); }
        .db-goal-btn { background:var(--accent); border:none; border-radius:8px; padding:8px 16px; color:white; font-size:13px; cursor:pointer; transition:background 0.2s; font-family:inherit; }
        .db-goal-btn:hover { background:#4a6be0; }
        .db-genre-wrap { display:flex; align-items:center; gap:20px; }
        .db-genre-chart { width:160px; height:160px; flex-shrink:0; }
        .db-genre-legend { flex:1; display:flex; flex-direction:column; gap:10px; }
        .db-genre-item { display:flex; align-items:center; gap:8px; font-size:13px; }
        .db-genre-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
        .db-genre-name { flex:1; color:var(--text2); }
        .db-genre-pct { font-family:monospace; color:var(--text3); font-size:12px; }
        .db-empty { text-align:center; padding:40px 20px; color:var(--text3); font-size:14px; }
        .db-tooltip { position:fixed; background:#1a1d2e; border-radius:8px; padding:8px 12px; font-size:12px; color:white; font-family:monospace; pointer-events:none; z-index:999; display:none; white-space:nowrap; }
    </style>
</head>
<body>

<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="mypage-container">
    <div class="tab-menu">
        <button class="tab-btn active"  onclick="showTab('profile')">프로필</button>
        <button class="tab-btn"         onclick="showTab('reviews')">독후감 기록</button>
        <button class="tab-btn"         onclick="showTab('dashboard')">독서 대시보드</button>
        <button class="tab-btn"         onclick="showTab('password')">비밀번호 변경</button>
    </div>

    <!-- ── 탭 1: 프로필 ── -->
    <div id="profile-tab" class="tab-content active">
        <div class="user-card">
            <div class="user-info">
                <!-- model 에서 user 객체를 받아 표시 (컨트롤러에서 DB 조회 후 주입) -->
                <h3 th:text="${user != null ? user.name : session.SS_USER_NAME}">이름</h3>
            </div>
            <div style="margin-top: 20px;">
                <div class="info-row">
                    <span class="info-label">이메일</span>
                    <span class="info-value" th:text="${user != null ? user.email : '-'}">이메일</span>
                </div>
                <div class="info-row">
                    <span class="info-label">아이디</span>
                    <!-- userId = 로그인 ID (VARCHAR PK) -->
                    <span class="info-value" th:text="${user != null ? user.userId : session.SS_USER_ID}">아이디</span>
                </div>
            </div>
        </div>

        <div class="user-card">
            <ul class="menu-list">
                <li><button onclick="showTab('reviews')">📖 내 독후감 기록 조회</button></li>
                <li><button onclick="location.href='/user/dashboard'">📊 독서 대시보드</button></li>
                <li><button onclick="showTab('password')">🔒 비밀번호 변경</button></li>
                <li><button class="danger" onclick="showDeleteModal()">⚠️ 회원 탈퇴</button></li>
            </ul>
            <a th:href="@{/}" class="home-link">홈으로 돌아가기</a>
        </div>
    </div>

    <!-- ── 탭 2: 독서 대시보드 ── -->
    <div id="dashboard-tab" class="tab-content db">
        <div class="db-grid" style="margin-bottom:16px;">
            <div class="db-stat-grid">
                <div class="db-stat-item"><div class="num" id="db-totalBooks">0</div><div class="lbl">등록한 책</div></div>
                <div class="db-stat-item"><div class="num" id="db-streak">0</div><div class="lbl">연속 독서일 🔥</div></div>
                <div class="db-stat-item"><div class="num" id="db-thisMonth">0</div><div class="lbl">이번 달 등록</div></div>
                <div class="db-stat-item"><div class="num" id="db-avgPerMonth">0</div><div class="lbl">월평균 등록량</div></div>
            </div>
        </div>
        <div class="db-grid">
            <div class="db-card db-card-full">
                <div class="db-card-title">독서 스트릭</div>
                <div class="db-grass-wrap">
                    <div class="db-grass-months" id="db-grassMonths"></div>
                    <div class="db-grass-body">
                        <div class="db-grass-days" id="db-grassDayLabels"></div>
                        <div class="db-grass-cols" id="db-grassCols"></div>
                    </div>
                </div>
                <div class="db-grass-legend">
                    <span>없음</span>
                    <div class="db-legend-cell" style="background:#edf0f7;border:1px solid #e4e7f0"></div>
                    <div class="db-legend-cell" style="background:#c8e6c9"></div>
                    <div class="db-legend-cell" style="background:#81c784"></div>
                    <div class="db-legend-cell" style="background:#4caf50"></div>
                    <div class="db-legend-cell" style="background:#2e7d32"></div>
                    <span>많음</span>
                </div>
            </div>
            <div class="db-card">
                <div class="db-card-title">월별 독서량</div>
                <div class="db-chart-container"><canvas id="db-monthChart"></canvas></div>
            </div>
            <div class="db-card">
                <div class="db-card-title">장르 분포</div>
                <div class="db-genre-wrap">
                    <div class="db-genre-chart"><canvas id="db-genreChart"></canvas></div>
                    <div class="db-genre-legend" id="db-genreLegend"></div>
                </div>
            </div>
            <div class="db-card">
                <div class="db-card-title">독서 목표</div>
                <div class="db-goal-section">
                    <div class="db-goal-item">
                        <div class="db-goal-header"><span class="db-goal-label">주간 목표</span><span class="db-goal-val" id="db-weeklyVal">0 / 0권</span></div>
                        <div class="db-progress-bar"><div class="db-progress-fill" id="db-weeklyBar"></div></div>
                        <div class="db-goal-input-row">
                            <input class="db-goal-input" type="number" id="db-weeklyGoalInput" placeholder="주간 목표 권수" min="1" max="30">
                            <button class="db-goal-btn" onclick="dbSetGoal('weekly')">설정</button>
                        </div>
                    </div>
                    <div class="db-goal-item">
                        <div class="db-goal-header"><span class="db-goal-label">월간 목표</span><span class="db-goal-val" id="db-monthlyVal">0 / 0권</span></div>
                        <div class="db-progress-bar"><div class="db-progress-fill" id="db-monthlyBar"></div></div>
                        <div class="db-goal-input-row">
                            <input class="db-goal-input" type="number" id="db-monthlyGoalInput" placeholder="월간 목표 권수" min="1" max="100">
                            <button class="db-goal-btn" onclick="dbSetGoal('monthly')">설정</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="db-card">
                <div class="db-card-title">최근 독서</div>
                <div class="db-book-list" id="db-bookList"></div>
            </div>
        </div>
        <div id="db-tooltip" class="db-tooltip"></div>
    </div>

    <!-- ── 탭 3: 독후감 기록 ── -->
    <div id="reviews-tab" class="tab-content">
        <h2 class="page-title">📖 내 독후감 기록</h2>

        <div th:if="${reviews != null and !reviews.isEmpty()}">
            <div class="review-card" th:each="r : ${reviews}">
                <div class="review-book"   th:text="${r.bookTitle}">책 제목</div>
                <div class="review-author" th:text="'저자: ' + ${r.bookAuthor}">저자</div>
                <div class="review-meta">
                    <span th:text="'발송일: ' + ${r.deliveryDate}"></span>
                    <span th:text="'발송시간: ' + ${r.deliveryTime}"></span>
                    <span class="review-status"
                          th:classappend="${r.isSent == 1} ? 'status-sent' : 'status-pending'"
                          th:text="${r.isSent == 1} ? '발송 완료' : '발송 대기'">
                    </span>
                </div>
            </div>
        </div>

        <div th:if="${reviews == null or reviews.isEmpty()}" class="empty-state">
            <div class="icon">✉️</div>
            <p>아직 생성한 독후감이 없어요.<br>책을 읽고 미래의 나에게 편지를 보내보세요!</p>
        </div>
    </div>

    <!-- ── 탭 3: 비밀번호 변경 ── -->
    <div id="password-tab" class="tab-content">
        <div class="card">
            <h2>🔒 비밀번호 변경</h2>

            <div class="form-group">
                <label>현재 비밀번호</label>
                <input type="password" id="currentPassword" class="form-control" placeholder="현재 비밀번호를 입력해주세요.">
                <span class="error-msg" id="current-error"></span>
            </div>

            <div class="form-group">
                <label>새 비밀번호</label>
                <input type="password" id="newPassword" class="form-control"
                       placeholder="새 비밀번호를 입력해주세요." oninput="checkNewPassword()">
                <span class="hint">문자, 숫자, 특수문자 포함 8~20자 이내</span>
                <span class="error-msg" id="new-error"></span>
            </div>

            <div class="form-group">
                <label>새 비밀번호 확인</label>
                <input type="password" id="confirmPassword" class="form-control"
                       placeholder="새 비밀번호를 다시 입력해주세요." oninput="checkConfirm()">
                <span class="error-msg" id="confirm-error"></span>
            </div>

            <button class="btn btn-primary btn-block" style="margin-top:8px;" onclick="changePassword()">비밀번호 변경</button>
        </div>
    </div>
</div>

<!-- ── 회원탈퇴 모달 ── -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
        <p>회원을 탈퇴하려면 비밀번호를 입력해주세요.</p>
        <div style="margin: 16px 0;">
            <input type="password" id="delete-password" class="form-control" placeholder="비밀번호">
            <span class="error-msg" id="delete-error"></span>
        </div>
        <button class="btn btn-danger btn-block" onclick="deleteAccount()">회원 탈퇴</button>
        <button class="btn btn-outline btn-block" style="margin-top:8px;" onclick="closeDeleteModal()">취소</button>
    </div>
</div>

<!-- ── 결과 안내 모달 ── -->
<div class="modal-overlay" id="resultModal">
    <div class="modal-box">
        <p id="result-msg"></p>
        <button class="btn btn-primary" id="result-btn" onclick="document.getElementById('resultModal').classList.remove('show')">확인</button>
    </div>
</div>

<!-- ── 비밀번호 변경 완료 모달 ── -->
<div class="modal-overlay" id="successModal">
    <div class="modal-box">
        <p>비밀번호가 성공적으로 변경되었습니다.</p>
        <button class="btn btn-primary" onclick="closeSuccessModal()">확인</button>
    </div>
</div>

<script>
    /** 탭 전환. event.target 대신 탭 인덱스로 버튼을 찾아 active 처리한다 */
    const TAB_NAMES = ['profile', 'reviews', 'dashboard', 'password'];

    function showTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(tabName + '-tab').classList.add('active');

        const idx = TAB_NAMES.indexOf(tabName);
        document.querySelectorAll('.tab-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === idx);
        });

        if (tabName === 'dashboard') dbLoad();
    }

    // ── 독서 대시보드 ──────────────────────────────────────────────────────────
    let dbLoaded = false, DB_BOOKS = [], dbReadDates = new Set();
    let dbGoals = { weekly: 3, monthly: 10 };
    let dbMonthChart = null, dbGenreChart = null;

    function dbLoad() {
        if (dbLoaded) return;
        dbLoaded = true;
        fetch('/user/dashboard/stats')
            .then(res => res.json())
            .then(data => {
                DB_BOOKS = (data.books || []).map(b => ({ ...b, genre: dbGuessGenre(b.title), emoji: dbEmoji(b.title) }));
                dbReadDates = new Set(DB_BOOKS.map(b => b.date).filter(Boolean));
                dbUpdateStats(); dbBuildGrass(); dbBuildMonthChart(); dbBuildGenreChart(); dbBuildBookList(); dbUpdateGoals();
            })
            .catch(err => console.error('대시보드 로딩 실패', err));
    }

    function dbGuessGenre(t) {
        if (!t) return '기타';
        if (/역사|조선|왕|전쟁/.test(t)) return '역사';
        if (/과학|우주|물리|뇌/.test(t))  return '과학';
        if (/철학|논어|인생|존재/.test(t)) return '철학';
        if (/경제|투자|주식|돈/.test(t))   return '경제';
        if (/심리|마음|감정|관계/.test(t)) return '심리';
        return '소설';
    }
    function dbEmoji(t) {
        if (!t) return '📚';
        if (/사랑/.test(t)) return '📖'; if (/채식/.test(t)) return '🌿';
        if (/코스모스/.test(t)) return '🌌'; if (/데미안/.test(t)) return '🦋';
        return '📚';
    }

    function dbUpdateStats() {
        const now = new Date();
        const monthBooks = DB_BOOKS.filter(b => { if (!b.date) return false; const d = new Date(b.date); return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth(); }).length;
        const yearBooks  = DB_BOOKS.filter(b => b.date && new Date(b.date).getFullYear()===now.getFullYear()).length;
        document.getElementById('db-totalBooks').textContent  = DB_BOOKS.length;
        document.getElementById('db-streak').textContent      = dbCalcStreak();
        document.getElementById('db-thisMonth').textContent   = monthBooks;
        document.getElementById('db-avgPerMonth').textContent = (yearBooks / Math.max(now.getMonth()+1,1)).toFixed(1);
    }
    function dbCalcStreak() {
        const today = new Date(); let streak = 0;
        for (let i = 0; i < 365; i++) {
            const d = new Date(today); d.setDate(d.getDate()-i);
            if (dbReadDates.has(d.toISOString().split('T')[0])) streak++;
            else if (i > 0) break;
        }
        return streak;
    }

    function dbBuildGrass() {
        const today = new Date(), startDate = new Date(today);
        startDate.setDate(startDate.getDate()-364);
        startDate.setDate(startDate.getDate()-startDate.getDay());
        const cols = document.getElementById('db-grassCols');
        const monthsEl = document.getElementById('db-grassMonths');
        const dayLabels = document.getElementById('db-grassDayLabels');
        const tooltip = document.getElementById('db-tooltip');
        cols.innerHTML=''; monthsEl.innerHTML=''; dayLabels.innerHTML='';
        ['','월','','수','','금',''].forEach(d => { const el=document.createElement('div'); el.className='db-grass-day-label'; el.textContent=d; dayLabels.appendChild(el); });
        const monthNames=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
        let lastMonth=-1; const cur=new Date(startDate);
        while (cur<=today) {
            const col=document.createElement('div'); col.className='db-grass-col';
            for (let dow=0;dow<7;dow++) {
                const cell=document.createElement('div'); cell.className='db-grass-cell';
                const dateKey=cur.toISOString().split('T')[0]; const month=cur.getMonth();
                if (cur>today) { cell.classList.add('l0'); cell.style.opacity='0'; }
                else {
                    const booksOnDate=DB_BOOKS.filter(b=>b.date===dateKey); const count=booksOnDate.length;
                    cell.classList.add('l'+Math.min(count,4));
                    cell.addEventListener('mouseenter',e=>{ tooltip.style.display='block'; tooltip.innerHTML=count>0?dateKey+'<br>'+booksOnDate.map(b=>b.title).join(', '):dateKey+'<br>기록 없음'; });
                    cell.addEventListener('mousemove',e=>{ tooltip.style.left=(e.clientX+12)+'px'; tooltip.style.top=(e.clientY-36)+'px'; });
                    cell.addEventListener('mouseleave',()=>{ tooltip.style.display='none'; });
                }
                col.appendChild(cell);
                if (dow===0&&month!==lastMonth) { const mLabel=document.createElement('div'); mLabel.className='db-grass-month-label'; mLabel.textContent=monthNames[month]; mLabel.style.width='52px'; monthsEl.appendChild(mLabel); lastMonth=month; }
                cur.setDate(cur.getDate()+1);
            }
            cols.appendChild(col);
        }
    }

    function dbBuildMonthChart() {
        const now=new Date(); const monthData=Array(12).fill(0);
        DB_BOOKS.forEach(b=>{ if(!b.date)return; const d=new Date(b.date); if(d.getFullYear()===now.getFullYear())monthData[d.getMonth()]++; });
        if(dbMonthChart)dbMonthChart.destroy();
        dbMonthChart=new Chart(document.getElementById('db-monthChart'),{ type:'bar', data:{ labels:['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'], datasets:[{ data:monthData, backgroundColor:monthData.map((_,i)=>i===now.getMonth()?'rgba(91,124,248,0.85)':'rgba(91,124,248,0.25)'), borderColor:monthData.map((_,i)=>i===now.getMonth()?'rgba(91,124,248,1)':'rgba(91,124,248,0.4)'), borderWidth:1, borderRadius:6 }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{grid:{color:'#f0f2f8'},ticks:{color:'#adb5c9',font:{size:11}}}, y:{grid:{color:'#f0f2f8'},ticks:{color:'#adb5c9',font:{size:11},stepSize:1},beginAtZero:true} } } });
    }

    function dbBuildGenreChart() {
        const genreCount={};
        DB_BOOKS.forEach(b=>{ genreCount[b.genre]=(genreCount[b.genre]||0)+1; });
        const labels=Object.keys(genreCount), data=Object.values(genreCount);
        if(labels.length===0){ document.getElementById('db-genreLegend').innerHTML='<p style="color:#adb5c9;font-size:13px;">등록된 책이 없습니다.</p>'; return; }
        const colors=['#5b7cf8','#7c9cff','#34d399','#f59e0b','#f472b6','#60a5fa'];
        if(dbGenreChart)dbGenreChart.destroy();
        dbGenreChart=new Chart(document.getElementById('db-genreChart'),{ type:'doughnut', data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0,hoverOffset:6}]}, options:{responsive:true,maintainAspectRatio:false,cutout:'70%',plugins:{legend:{display:false}}} });
        const legend=document.getElementById('db-genreLegend'); legend.innerHTML='';
        const total=data.reduce((a,b)=>a+b,0);
        labels.forEach((l,i)=>{ const item=document.createElement('div'); item.className='db-genre-item'; item.innerHTML=`<div class="db-genre-dot" style="background:${colors[i%colors.length]}"></div><span class="db-genre-name">${l}</span><span class="db-genre-pct">${Math.round(data[i]/total*100)}%</span>`; legend.appendChild(item); });
    }

    function dbBuildBookList() {
        const list=document.getElementById('db-bookList'); list.innerHTML='';
        if(DB_BOOKS.length===0){ list.innerHTML='<div class="db-empty">등록된 책이 없습니다.<br>책을 등록하고 독서 기록을 시작해보세요!</div>'; return; }
        DB_BOOKS.slice(0,5).forEach(b=>{ const item=document.createElement('div'); item.className='db-book-item'; item.innerHTML=`<div class="db-book-cover">${b.emoji}</div><div class="db-book-info"><div class="db-book-title">${b.title}</div><div class="db-book-author">${b.author}</div></div><div class="db-book-date">${b.date||''}</div>`; list.appendChild(item); });
    }

    function dbSetGoal(type) {
        const input=document.getElementById('db-'+type+'GoalInput'); const val=parseInt(input.value);
        if(!val||val<1)return; dbGoals[type]=val; input.value=''; dbUpdateGoals();
    }
    function dbUpdateGoals() {
        const now=new Date(); const weekStart=new Date(now); weekStart.setDate(now.getDate()-now.getDay());
        const weeklyRead=DB_BOOKS.filter(b=>b.date&&new Date(b.date)>=weekStart).length;
        const monthlyRead=DB_BOOKS.filter(b=>{ if(!b.date)return false; const d=new Date(b.date); return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth(); }).length;
        document.getElementById('db-weeklyVal').textContent=weeklyRead+' / '+dbGoals.weekly+'권';
        document.getElementById('db-monthlyVal').textContent=monthlyRead+' / '+dbGoals.monthly+'권';
        setTimeout(()=>{ document.getElementById('db-weeklyBar').style.width=Math.min(weeklyRead/dbGoals.weekly*100,100)+'%'; document.getElementById('db-monthlyBar').style.width=Math.min(monthlyRead/dbGoals.monthly*100,100)+'%'; },300);
    }

    function showDeleteModal() { document.getElementById('deleteModal').classList.add('show'); }
    function closeDeleteModal() {
        document.getElementById('deleteModal').classList.remove('show');
        document.getElementById('delete-password').value = '';
        document.getElementById('delete-error').textContent = '';
    }

    function deleteAccount() {
        const password = document.getElementById('delete-password').value;
        const error    = document.getElementById('delete-error');
        error.textContent = '';
        if (!password) { error.textContent = '비밀번호를 입력해주세요.'; return; }

        fetch('/user/mypage/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'password=' + encodeURIComponent(password)
        })
        .then(res => res.json())
        .then(data => {
            // MsgDTO: {"result": 1, "msg": "..."}
            if (data.result === 1) {
                closeDeleteModal();
                document.getElementById('result-msg').textContent = '회원탈퇴가 완료되었습니다.';
                document.getElementById('result-btn').onclick = () => window.location.href = '/';
                document.getElementById('resultModal').classList.add('show');
            } else {
                error.textContent = data.msg || '비밀번호가 일치하지 않습니다.';
            }
        })
        .catch(() => { error.textContent = '오류가 발생했습니다. 다시 시도해주세요.'; });
    }

    const PW_REGEX = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*])[a-zA-Z\d!@#$%^&*]{8,20}$/;

    function checkNewPassword() {
        const val = document.getElementById('newPassword').value;
        const err = document.getElementById('new-error');
        err.textContent = (val && !PW_REGEX.test(val)) ? '비밀번호가 조건에 맞지 않습니다.' : '';
        checkConfirm();
    }

    function checkConfirm() {
        const newPw   = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;
        const err     = document.getElementById('confirm-error');
        err.textContent = (confirm && newPw !== confirm) ? '비밀번호가 일치하지 않습니다.' : '';
    }

    function changePassword() {
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword     = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        document.getElementById('current-error').textContent = '';
        document.getElementById('new-error').textContent     = '';
        document.getElementById('confirm-error').textContent = '';

        if (!currentPassword) { document.getElementById('current-error').textContent = '현재 비밀번호를 입력해주세요.'; return; }
        if (!newPassword)      { document.getElementById('new-error').textContent     = '새 비밀번호를 입력해주세요.'; return; }
        if (!PW_REGEX.test(newPassword)) { document.getElementById('new-error').textContent = '비밀번호가 조건에 맞지 않습니다.'; return; }
        if (newPassword !== confirmPassword) { document.getElementById('confirm-error').textContent = '비밀번호가 일치하지 않습니다.'; return; }

        fetch('/user/mypage/changePassword', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'currentPassword=' + encodeURIComponent(currentPassword) +
                  '&newPassword='    + encodeURIComponent(newPassword)
        })
        .then(res => res.json())
        .then(data => {
            // MsgDTO: {"result": 1, "msg": "..."}
            if (data.result === 1) {
                document.getElementById('successModal').classList.add('show');
            } else {
                document.getElementById('current-error').textContent = data.msg || '현재 비밀번호가 일치하지 않습니다.';
            }
        })
        .catch(() => { document.getElementById('current-error').textContent = '오류가 발생했습니다.'; });
    }

    function closeSuccessModal() {
        document.getElementById('successModal').classList.remove('show');
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value     = '';
        document.getElementById('confirmPassword').value = '';
        showTab('profile');
    }
</script>
</body>
</html>
