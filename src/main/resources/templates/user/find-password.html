<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .form-container {
            max-width: 480px;
            width: 90%;
            padding: 56px 56px;
        }
        .form-logo { height: 64px; }
        .form-container p[style*="font-size:15px"] {
            font-size: 20px !important;
            margin-bottom: 32px !important;
        }
        .form-group { margin-bottom: 28px; }
        .form-control {
            padding: 18px 20px;
            font-size: 17px;
            border-radius: 10px;
        }
        .error-msg { font-size: 14px; }
        .btn-primary.btn-block {
            padding: 18px;
            font-size: 17px;
            border-radius: 10px;
            margin-top: 8px;
        }
        #step2 p[style*="font-size:12px"] {
            font-size: 14px !important;
            margin-bottom: 28px !important;
        }
    </style>
</head>
<body class="auth-page">
<!-- STEP 1: 아이디 + 이메일 -->
<div class="form-container" id="step1">
    <div class="form-title">
        <a th:href="@{/}">
            <img th:src="@{/images/logo.png}" alt="FROM 로고" class="form-logo">
        </a>
    </div>
    <p style="text-align:center; font-size:15px; font-weight:700; color:#1E3A5F; margin-bottom:24px;">비밀번호 찾기</p>
    <div class="form-group">
        <input type="text" id="username" class="form-control" placeholder="아이디를 입력해주세요.">
        <span class="error-msg" id="username-error"></span>
    </div>
    <div class="form-group">
        <input type="email" id="email" class="form-control" placeholder="이메일을 입력해주세요.">
        <span class="error-msg" id="email-error"></span>
    </div>
    <button class="btn btn-primary btn-block" onclick="sendCode()">인증메일 받기</button>
</div>

<!-- STEP 2: 비밀번호 변경 -->
<div class="form-container" id="step2" style="display:none;">
    <div class="form-title">
        <a th:href="@{/}">
            <img th:src="@{/images/logo.png}" alt="FROM 로고" class="form-logo">
        </a>
    </div>
    <p style="text-align:center; font-size:15px; font-weight:700; color:#1E3A5F; margin-bottom:24px;">비밀번호 변경</p>
    <p style="font-size:12px; color:#888; margin-bottom:20px; text-align:center;">
        비밀번호는 문자, 숫자, 특수문자 포함 8~20자 이내로 입력해주세요.
    </p>
    <div class="form-group">
        <input type="password" id="new-password" class="form-control" placeholder="새 비밀번호를 입력해주세요.">
        <span class="error-msg" id="new-password-error"></span>
    </div>
    <div class="form-group">
        <input type="password" id="password-confirm" class="form-control" placeholder="비밀번호를 다시 입력해주세요.">
        <span class="error-msg" id="password-confirm-error"></span>
    </div>
    <button class="btn btn-primary btn-block" onclick="changePassword()">비밀번호 변경</button>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <p id="modal-msg"></p>
        <button class="btn btn-primary" onclick="closeModal()" id="modal-btn">확인</button>
    </div>
</div>

<script>
    function sendCode() {
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        document.getElementById('username-error').textContent = '';
        document.getElementById('email-error').textContent = '';

        if (!username) { document.getElementById('username-error').textContent = '아이디를 입력되지 않았습니다.'; return; }
        if (!email) { document.getElementById('email-error').textContent = '이메일이 입력되지 않았습니다.'; return; }

        fetch('/user/findPassword/sendCode', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `userId=${encodeURIComponent(username)}&email=${encodeURIComponent(email)}` // ← username → userId
        })
            .then(res => res.json())
            .then(data => {
                if (data.result === 1) { // ← 수정
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                } else {
                    showModal(data.msg || '아이디 혹은 이메일을 찾을수 없습니다.'); // ← 수정
                }
            });
    }

    function changePassword() {
        const newPw = document.getElementById('new-password').value;
        const confirm = document.getElementById('password-confirm').value;
        document.getElementById('new-password-error').textContent = '';
        document.getElementById('password-confirm-error').textContent = '';

        const regex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,20}$/;
        if (!regex.test(newPw)) { document.getElementById('new-password-error').textContent = '비밀번호가 조건에 맞지 않습니다.'; return; }
        if (newPw !== confirm) { document.getElementById('password-confirm-error').textContent = '비밀번호가 일치하지 않습니다.'; return; }

        fetch('/user/findPassword/change', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `newPassword=${encodeURIComponent(newPw)}`
        })
            .then(res => res.json())
            .then(data => {
                if (data.result === 1) { // ← 수정
                    document.getElementById('modal-msg').textContent = '비밀번호가 성공적으로 변경되었습니다.';
                    document.getElementById('modal-btn').onclick = () => window.location.href = '/user/login';
                    document.getElementById('modal').classList.add('show');
                } else {
                    showModal(data.msg || '변경에 실패했습니다.'); // ← 수정
                }
            });
    }

    function showModal(msg) {
        document.getElementById('modal-msg').textContent = msg;
        document.getElementById('modal-btn').onclick = closeModal;
        document.getElementById('modal').classList.add('show');
    }
    function closeModal() { document.getElementById('modal').classList.remove('show'); }
</script>
</body>
</html>
