<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .page-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .float-shape {
            position: absolute;
            border-radius: 34px;
            background: linear-gradient(145deg, #5cbcff, #2463ff);
            box-shadow: inset 0 2px 10px rgba(255,255,255,0.3), 0 30px 60px rgba(37,99,235,0.20);
            opacity: 0.88;
        }
        .shape-1 { width: 420px; height: 420px; top: 110px; left: -120px; transform: rotate(-24deg); }
        .shape-2 { width: 600px; height: 300px; top: -40px; right: -80px; transform: rotate(-16deg); }

        .form-container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            width: 90%;
            padding: 52px 48px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: 28px;
            box-shadow: 0 32px 80px rgba(37,99,235,0.16), 0 8px 24px rgba(0,0,0,0.06);
        }
        .form-logo { height: 56px; }
        .form-group { margin-bottom: 20px; }
        .error-msg { font-size: 13px; }

        .form-control {
            border-color: rgba(37,99,235,0.18);
            background: rgba(255,255,255,0.90);
        }
        .form-control:focus { border-color: #2563eb; }

        .page-title {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #1e3a5f;
            margin-bottom: 28px;
        }
        .page-sub {
            font-size: 14px;
            color: #888;
            margin-bottom: 24px;
            text-align: center;
            line-height: 1.6;
        }

        .btn-auth {
            width: 100%;
            height: 52px;
            margin-top: 4px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #5da8ff, #2563eb);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(37,99,235,0.25);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Jua', sans-serif;
        }
        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 40px rgba(37,99,235,0.32);
        }
    </style>
</head>
<body class="auth-page">

<div class="page-bg">
    <div class="float-shape shape-1"></div>
    <div class="float-shape shape-2"></div>
</div>

<!-- STEP 1: 아이디 + 이메일 -->
<div class="form-container" id="step1">
    <div class="form-title">
        <a th:href="@{/}">
            <img th:src="@{/images/logo.png}" alt="FROM 로고" class="form-logo">
        </a>
    </div>
    <p class="page-title">비밀번호 찾기</p>
    <form autocomplete="off" onsubmit="return false;">
        <div class="form-group">
            <input type="text" id="username" class="form-control" placeholder="아이디를 입력해주세요.">
            <span class="error-msg" id="username-error"></span>
        </div>
        <div class="form-group">
            <input type="email" id="email" class="form-control" placeholder="이메일을 입력해주세요.">
            <span class="error-msg" id="email-error"></span>
        </div>
        <button class="btn-auth" onclick="sendCode()">인증메일 받기</button>
    </form>
</div>

<!-- STEP 2: 인증번호 입력 -->
<div class="form-container" id="step2" style="display:none;">
    <div class="form-title">
        <a th:href="@{/}">
            <img th:src="@{/images/logo.png}" alt="FROM 로고" class="form-logo">
        </a>
    </div>
    <p class="page-title">인증번호 확인</p>
    <p class="page-sub">이메일로 발송된 인증번호를 입력해주세요.</p>
    <form autocomplete="off" onsubmit="return false;">
        <div class="form-group">
            <input type="text" id="verify-code" class="form-control" placeholder="인증번호 6자리를 입력해주세요.">
            <span class="error-msg" id="verify-code-error"></span>
        </div>
        <button class="btn-auth" onclick="verifyCode()">인증 확인</button>
    </form>
</div>

<!-- STEP 3: 비밀번호 변경 -->
<div class="form-container" id="step3" style="display:none;">
    <div class="form-title">
        <a th:href="@{/}">
            <img th:src="@{/images/logo.png}" alt="FROM 로고" class="form-logo">
        </a>
    </div>
    <p class="page-title">비밀번호 변경</p>
    <p class="page-sub">문자, 숫자, 특수문자 포함 8~20자 이내로 입력해주세요.</p>
    <form autocomplete="off" onsubmit="return false;">
        <div class="form-group">
            <input type="password" id="new-password" class="form-control"
                   placeholder="새 비밀번호를 입력해주세요." oninput="checkPwMatch();">
            <span class="error-msg" id="new-password-error"></span>
        </div>
        <div class="form-group">
            <input type="password" id="password-confirm" class="form-control"
                   placeholder="비밀번호를 다시 입력해주세요." oninput="checkPwMatch()">
            <span class="error-msg" id="password-confirm-error"></span>
            <span class="success-msg" id="password-confirm-success"></span>
        </div>
        <button class="btn-auth" onclick="changePassword()">비밀번호 변경</button>
    </form>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <p id="modal-msg"></p>
        <button class="btn btn-primary" onclick="closeModal()" id="modal-btn">확인</button>
    </div>
</div>

<script>
    function sendCode() {
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        document.getElementById('username-error').textContent = '';
        document.getElementById('email-error').textContent = '';
        if (!username) { document.getElementById('username-error').textContent = '아이디를 입력되지 않았습니다.'; return; }
        if (!email) { document.getElementById('email-error').textContent = '이메일이 입력되지 않았습니다.'; return; }
        fetch('/user/findPassword/sendCode', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `userId=${encodeURIComponent(username)}&email=${encodeURIComponent(email)}`
        })
            .then(res => res.json())
            .then(data => {
                if (data.result === 1) {
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                } else {
                    showModal(data.msg || '아이디 혹은 이메일을 찾을 수 없습니다.');
                }
            });
    }

    function verifyCode() {
        const code = document.getElementById('verify-code').value.trim();
        document.getElementById('verify-code-error').textContent = '';
        if (!code) { document.getElementById('verify-code-error').textContent = '인증번호를 입력해주세요.'; return; }
        fetch('/user/findPassword/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `code=${encodeURIComponent(code)}`
        })
            .then(res => res.json())
            .then(data => {
                if (data.result === 1) {
                    document.getElementById('step2').style.display = 'none';
                    document.getElementById('step3').style.display = 'block';
                } else {
                    document.getElementById('verify-code-error').textContent = data.msg || '인증번호가 틀립니다.';
                }
            });
    }

    function checkPwMatch() {
        const pw = document.getElementById('new-password').value;
        const confirm = document.getElementById('password-confirm').value;
        const error = document.getElementById('password-confirm-error');
        const success = document.getElementById('password-confirm-success');
        error.textContent = ''; success.textContent = '';
        if (!confirm) return;
        if (pw === confirm) {
            success.textContent = '일치합니다.';
        } else {
            error.textContent = '일치하지 않습니다.';
        }
    }

    function changePassword() {
        const newPw = document.getElementById('new-password').value;
        const confirm = document.getElementById('password-confirm').value;
        document.getElementById('new-password-error').textContent = '';
        document.getElementById('password-confirm-error').textContent = '';
        document.getElementById('password-confirm-success').textContent = '';
        const regex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,20}$/;
        if (!regex.test(newPw)) { document.getElementById('new-password-error').textContent = '비밀번호가 조건에 맞지 않습니다.'; return; }
        if (newPw !== confirm) { document.getElementById('password-confirm-error').textContent = '일치하지 않습니다.'; return; }
        fetch('/user/findPassword/change', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `newPassword=${encodeURIComponent(newPw)}`
        })
            .then(res => res.json())
            .then(data => {
                if (data.result === 1) {
                    document.getElementById('modal-msg').textContent = '비밀번호가 성공적으로 변경되었습니다.';
                    document.getElementById('modal-btn').onclick = () => window.location.href = '/user/login';
                    document.getElementById('modal').classList.add('show');
                } else {
                    showModal(data.msg || '변경에 실패했습니다.');
                }
            });
    }

    function showModal(msg) {
        document.getElementById('modal-msg').textContent = msg;
        document.getElementById('modal-btn').onclick = closeModal;
        document.getElementById('modal').classList.add('show');
    }
    function closeModal() { document.getElementById('modal').classList.remove('show'); }
</script>
</body>
</html>
