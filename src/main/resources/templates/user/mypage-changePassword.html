<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: #f5f5f5; font-family: 'Nanum Myeongjo', serif; }

        .main-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; height: 72px; background: white; border-bottom: 1px solid #eee;
        }
        .main-nav { display: flex; align-items: center; gap: 48px; }
        .main-nav a { color: #333; text-decoration: none; font-size: 15px; font-weight: 500; }
        .main-nav a:hover { color: #6071E3; }
        .header-logout-btn {
            background: #6071E3; border: none; color: white;
            padding: 8px 24px; border-radius: 20px; cursor: pointer;
            font-size: 14px; font-weight: 700; text-decoration: none;
        }

        .content { max-width: 500px; margin: 60px auto; padding: 0 20px; }

        .card {
            background: white; border-radius: 16px; padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .card h2 {
            font-size: 20px; font-weight: 700; color: #1E3A5F;
            margin-bottom: 24px; padding-bottom: 12px;
            border-bottom: 2px solid #6071E3;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
        .form-control {
            width: 100%; padding: 12px 16px; border: 1.5px solid #ddd;
            border-radius: 8px; font-size: 14px; box-sizing: border-box;
            outline: none; transition: border-color 0.2s;
        }
        .form-control:focus { border-color: #6071E3; }
        .hint { font-size: 12px; color: #aaa; margin-top: 4px; }
        .error-msg { display: block; color: #e53935; font-size: 12px; margin-top: 4px; min-height: 16px; }
        .success-msg { display: block; color: #388e3c; font-size: 12px; margin-top: 4px; min-height: 16px; }

        .btn-submit {
            width: 100%; padding: 13px; background: #6071E3; color: white;
            border: none; border-radius: 8px; font-size: 15px; font-weight: 700;
            cursor: pointer; margin-top: 8px; transition: background 0.2s;
        }
        .btn-submit:hover { background: #4f5fd4; }

        .back-link {
            display: inline-block; margin-bottom: 20px;
            color: #6071E3; text-decoration: none; font-size: 14px;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<header class="main-header">
    <a href="/"><img th:src="@{/images/logo.png}" alt="from" style="height:60px;"></a>
    <div style="display:flex; align-items:center; gap:48px;">
        <nav class="main-nav">
            <a th:href="@{/book/register}">책 등록</a>
            <a th:href="@{/ranking}">랭킹</a>
            <a th:href="@{/review}">독후감</a>
            <a th:href="@{/user/mypage}">마이페이지</a>
        </nav>
        <a th:href="@{/user/logout}" class="header-logout-btn">로그아웃</a>
    </div>
</header>

<div class="content">
    <a th:href="@{/user/mypage}" class="back-link">← 마이페이지로</a>
    <div class="card">
        <h2>🔒 비밀번호 변경</h2>

        <div class="form-group">
            <label>현재 비밀번호</label>
            <input type="password" id="currentPassword" class="form-control" placeholder="현재 비밀번호를 입력해주세요.">
            <span class="error-msg" id="current-error"></span>
        </div>

        <div class="form-group">
            <label>새 비밀번호</label>
            <input type="password" id="newPassword" class="form-control" placeholder="새 비밀번호를 입력해주세요."
                   oninput="checkNewPassword()">
            <span class="hint">문자, 숫자, 특수문자 포함 8~20자 이내</span>
            <span class="error-msg" id="new-error"></span>
        </div>

        <div class="form-group">
            <label>새 비밀번호 확인</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="새 비밀번호를 다시 입력해주세요."
                   oninput="checkConfirm()">
            <span class="error-msg" id="confirm-error"></span>
        </div>

        <button class="btn-submit" onclick="changePassword()">비밀번호 변경</button>
    </div>
</div>

<!-- 완료 모달 -->
<div class="modal-overlay" id="successModal">
    <div class="modal-box">
        <p>비밀번호가 성공적으로 변경되었습니다.</p>
        <button class="btn btn-primary" onclick="window.location.href='/user/mypage'">확인</button>
    </div>
</div>

<script>
    const PW_REGEX = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*])[a-zA-Z\d!@#$%^&*]{8,20}$/;

    function checkNewPassword() {
        const val = document.getElementById('newPassword').value;
        const err = document.getElementById('new-error');
        if (val && !PW_REGEX.test(val)) {
            err.textContent = '비밀번호가 조건에 맞지 않습니다.';
        } else {
            err.textContent = '';
        }
        checkConfirm();
    }

    function checkConfirm() {
        const newPw = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;
        const err = document.getElementById('confirm-error');
        if (confirm && newPw !== confirm) {
            err.textContent = '비밀번호가 일치하지 않습니다.';
        } else {
            err.textContent = '';
        }
    }

    function changePassword() {
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        document.getElementById('current-error').textContent = '';
        document.getElementById('new-error').textContent = '';
        document.getElementById('confirm-error').textContent = '';

        if (!currentPassword) { document.getElementById('current-error').textContent = '현재 비밀번호를 입력해주세요.'; return; }
        if (!newPassword) { document.getElementById('new-error').textContent = '새 비밀번호를 입력해주세요.'; return; }
        if (!PW_REGEX.test(newPassword)) { document.getElementById('new-error').textContent = '비밀번호가 조건에 맞지 않습니다.'; return; }
        if (newPassword !== confirmPassword) { document.getElementById('confirm-error').textContent = '비밀번호가 일치하지 않습니다.'; return; }

        fetch('/user/mypage/changePassword', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `currentPassword=${encodeURIComponent(currentPassword)}&newPassword=${encodeURIComponent(newPassword)}`
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                document.getElementById('successModal').classList.add('show');
            } else {
                document.getElementById('current-error').textContent = data.message || '현재 비밀번호가 일치하지 않습니다.';
            }
        });
    }
</script>
</body>
</html>
