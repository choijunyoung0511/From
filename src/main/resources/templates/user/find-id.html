<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디 찾기 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .form-container {
            max-width: 480px;
            width: 90%;
            padding: 56px 56px;
        }
        .form-logo { height: 64px; }
        .form-container p[style*="font-size:15px"] {
            font-size: 20px !important;
            margin-bottom: 32px !important;
        }
        .form-group { margin-bottom: 28px; }
        .form-control {
            padding: 18px 20px;
            font-size: 17px;
            border-radius: 10px;
        }
        .error-msg { font-size: 14px; }
        .btn-primary.btn-block {
            padding: 18px;
            font-size: 17px;
            border-radius: 10px;
            margin-top: 8px;
        }
        #found-name { font-size: 16px !important; margin-bottom: 16px !important; }
        #step3 p[style*="font-size:18px"] { font-size: 22px !important; margin-bottom: 36px !important; }
    </style>
</head>
<body class="auth-page">
<!-- STEP 1: 이름 + 이메일 입력 -->
<div class="form-container" id="step1">
    <div class="form-title">
        <a th:href="@{/}">
            <img th:src="@{/images/logo.png}" alt="FROM 로고" class="form-logo">
        </a>
    </div>
    <p style="text-align:center; font-size:15px; font-weight:700; color:#1E3A5F; margin-bottom:24px;">아이디 찾기</p>
    <div class="form-group">
        <input type="text" id="name" class="form-control" placeholder="이름을 입력해주세요.">
        <span class="error-msg" id="name-error"></span>
    </div>
    <div class="form-group">
        <input type="email" id="email" class="form-control" placeholder="이메일을 입력해주세요.">
        <span class="error-msg" id="email-error"></span>
    </div>
    <button class="btn btn-primary btn-block" onclick="sendCode()">인증메일 받기</button>
</div>

<!-- STEP 2: 인증번호 입력 -->
<div class="form-container" id="step2" style="display:none;">
    <div class="form-title">
        <a th:href="@{/}">
            <img th:src="@{/images/logo.png}" alt="FROM 로고" class="form-logo">
        </a>
    </div>
    <p style="text-align:center; font-size:15px; font-weight:700; color:#1E3A5F; margin-bottom:24px;">인증번호 입력</p>
    <div class="form-group">
        <input type="text" id="code" class="form-control" placeholder="이메일로 온 인증번호를 입력해주세요.">
        <span class="error-msg" id="code-error"></span>
    </div>
    <button class="btn btn-primary btn-block" onclick="verifyCode()">인증메일 확인</button>
</div>

<!-- STEP 3: 아이디 찾기 완료 -->
<div class="form-container" id="step3" style="display:none;">
    <div class="form-title">
        <a th:href="@{/}">
            <img th:src="@{/images/logo.png}" alt="FROM 로고" class="form-logo">
        </a>
    </div>
    <p style="text-align:center; font-size:15px; font-weight:700; color:#1E3A5F; margin-bottom:24px;">아이디 찾기 완료</p>
    <p style="text-align:center; color:#555; margin-bottom:12px;" id="found-name"></p>
    <p style="text-align:center; font-size:18px; font-weight:700; color:#1E3A5F; margin-bottom:28px;">
        아이디: <span id="found-username"></span>
    </p>
    <a th:href="@{/user/login}" class="btn btn-primary btn-block" style="text-align:center; display:block; text-decoration:none;">
        로그인화면으로 돌아가기
    </a>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <p id="modal-msg"></p>
        <button class="btn btn-primary" onclick="closeModal()">확인</button>
    </div>
</div>

<script>
    function sendCode() {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        document.getElementById('name-error').textContent = '';
        document.getElementById('email-error').textContent = '';

        if (!name) { document.getElementById('name-error').textContent = '이름이 입력되지 않았습니다.'; return; }
        if (!email) { document.getElementById('email-error').textContent = '이메일이 입력되지 않았습니다.'; return; }

        fetch('/user/findId/sendCode', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`
        })
            .then(res => res.json())
            .then(data => {
                if (data.result === 1) { // ← 수정
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                } else {
                    showModal(data.msg || '아이디 혹은 이메일을 찾을수 없습니다.'); // ← 수정
                }
            });
    }

    function verifyCode() {
        const code = document.getElementById('code').value.trim();
        document.getElementById('code-error').textContent = '';

        if (!code) { document.getElementById('code-error').textContent = '인증번호가 입력되지 않았습니다.'; return; }

        fetch('/user/findId/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `code=${encodeURIComponent(code)}`
        })
            .then(res => res.json())
            .then(data => {
                if (data.existsYn === 'Y') { // ← 수정
                    document.getElementById('step2').style.display = 'none';
                    document.getElementById('step3').style.display = 'block';
                    document.getElementById('found-name').textContent = document.getElementById('name').value + '님의 아이디를 찾았습니다!';
                    document.getElementById('found-username').textContent = data.userId; // ← 수정
                } else {
                    showModal('인증번호가 틀립니다.');
                }
            });
    }

    function showModal(msg) {
        document.getElementById('modal-msg').textContent = msg;
        document.getElementById('modal').classList.add('show');
    }
    function closeModal() {
        document.getElementById('modal').classList.remove('show');
    }
</script>
</body>
</html>
