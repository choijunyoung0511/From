<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서비스 시작 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: url('/images/library.png') center/cover no-repeat;
            font-family: 'Jua', sans-serif;
            position: relative;
        }
        /* 중앙은 밝게, 사이드는 배경 살리는 방사형 오버레이 */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse at 50% 45%,
                rgba(255,255,255,0.85) 0%,
                rgba(255,255,255,0.70) 40%,
                rgba(255,255,255,0.42) 100%);
            pointer-events: none;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px !important;
            height: 64px !important;
            background: white;
            border-bottom: 1px solid #eee;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: relative; z-index: 10;
        }
        .main-logo { text-decoration: none; display: flex; align-items: center; }
        .main-logo img { height: 44px !important; }
        .main-nav { display: flex; align-items: center; gap: 40px !important; }
        .main-nav a {
            color: #333 !important;
            text-decoration: none;
            font-size: 15px !important;
            font-weight: 500;
            transition: color 0.2s;
        }
        .main-nav a:hover { color: #6071E3 !important; font-weight: 700; }
        .header-logout-btn {
            background: #6071E3 !important;
            border: none;
            color: white !important;
            padding: 8px 24px !important;
            border-radius: 30px !important;
            cursor: pointer;
            font-size: 13px !important;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }
        .header-logout-btn:hover { background: #4f5fd4 !important; transform: translateY(-2px); }

        .weather-widget {
            position: fixed;
            top: 78px;
            right: 30px;
            z-index: 15;
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-radius: 999px;
            background: rgba(255,255,255,0.85);
            border: 1px solid rgba(67,97,238,0.12);
            box-shadow: 0 8px 24px rgba(67,97,238,0.14);
            backdrop-filter: blur(10px);
            font-family: 'Jua', sans-serif;
        }
        .weather-widget .weather-icon { font-size: 20px; line-height: 1; }
        .weather-widget .weather-temp { font-size: 17px; font-weight: 700; color: #1A1A2E; }
        .weather-widget .weather-desc { font-size: 13px; color: #7A7899; }

        @media (max-width: 768px) {
            .weather-widget { top: 66px; right: 16px; padding: 8px 14px; }
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 100px);
            padding: 60px 20px;
            text-align: center;
            position: relative; z-index: 1;
        }

        .welcome-title {
            font-size: 52px;
            font-weight: 700;
            color: #1A1A2E;
            text-shadow: 0 2px 16px rgba(255,255,255,0.8);
            margin-bottom: 70px;
            font-family: 'Hi Melody', cursive;
            line-height: 1.4;
        }

        /* 스파클 */
        .sparkle-layer {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
        }
        .sp {
            position: absolute; font-size: 18px;
            color: rgba(96,113,227,0.28); animation: spFloat 4s ease-in-out infinite;
        }
        @keyframes spFloat {
            0%,100% { transform: translateY(0) rotate(0deg); opacity: .28; }
            50%      { transform: translateY(-8px) rotate(15deg); opacity: .42; }
        }

        .service-cards {
            display: flex;
            gap: 50px;
            margin-bottom: 60px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .service-card {
            background: #FFFFFF;
            border-radius: 28px;
            padding: 60px 50px;
            width: 360px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 20px 50px rgba(67,97,238,0.12);
            border: 1px solid rgba(67,97,238,0.08);
            backdrop-filter: blur(12px);
        }
        .service-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 28px 56px rgba(67,97,238,0.22);
            border-color: rgba(96,113,227,0.18);
        }
        .service-card img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 24px;
        }
        .service-card-title { font-size: 24px; font-weight: 700; color: #333; }

        .subtitle {
            font-size: 26px;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
            margin-bottom: 50px;
            font-weight: 600;
        }

        .back-btn {
            background: linear-gradient(135deg, #6071E3, #4361EE);
            color: white;
            border: none;
            padding: 22px 90px;
            border-radius: 50px;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(76,110,245,0.35);
        }
        .back-btn:hover {
            background: linear-gradient(135deg, #5B7CFA, #4361EE);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 16px 40px rgba(76,110,245,0.48);
        }

        /* ── AI 독서 서브메뉴 모달 ── */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-bg.show { display: flex; }

        .modal {
            background: white;
            border-radius: 28px;
            padding: 48px 40px;
            max-width: 700px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            animation: fadeUp 0.3s ease;
            text-align: center;
        }

        .modal-title {
            font-size: 26px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 15px;
            color: #888;
            margin-bottom: 40px;
        }

        .studio-section { margin-bottom: 18px; }
        .studio-section-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .studio-section-bar {
            display: inline-block;
            width: 3px; height: 13px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .studio-section-bar.blue  { background: #6071E3; }
        .studio-section-bar.amber { background: #f59e0b; }
        .studio-section-text {
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            letter-spacing: .07em;
            text-transform: uppercase;
        }
        .studio-section-badge {
            font-size: 10px;
            border-radius: 99px;
            padding: 2px 9px;
            font-weight: 700;
        }
        .studio-section-badge.blue  { background: #eef1fe; color: #6071E3; }
        .studio-section-badge.amber { background: #fff7ed; color: #d97706; }

        .ai-cards { display: flex; gap: 14px; }

        .sub-card {
            flex: 1;
            background: #f8f9ff;
            border: 1.5px solid #e4e7f0;
            border-radius: 18px;
            padding: 26px 20px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            transition: all .22s ease;
        }
        .sub-card:hover {
            border-color: #6071E3;
            background: #eef1fe;
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(96,113,227,.2);
        }

        .sub-card-icon  { font-size: 40px; margin-bottom: 12px; }
        .sub-card-title { font-size: 15px; font-weight: 700; color: #1a1d2e; margin-bottom: 6px; }
        .sub-card-desc  { font-size: 12px; color: #9ca3af; line-height: 1.6; }

        .recommend-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #fffbf5;
            border: 1.5px solid #fde68a;
            border-radius: 18px;
            padding: 18px 24px;
            text-decoration: none;
            transition: all .22s ease;
        }
        .recommend-card:hover {
            border-color: #f59e0b;
            background: #fff7ed;
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(245,158,11,.15);
        }
        .recommend-card-icon  { font-size: 28px; flex-shrink: 0; }
        .recommend-card-title { font-size: 15px; font-weight: 700; color: #1a1d2e; margin-bottom: 4px; }
        .recommend-card-desc  { font-size: 12px; color: #9ca3af; line-height: 1.6; }
        .recommend-card-arrow { margin-left: auto; font-size: 22px; color: #d97706; font-weight: 300; }

        .modal-close-btn {
            background: none;
            border: 2px solid #ddd;
            border-radius: 50px;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Jua', sans-serif;
        }
        .modal-close-btn:hover { border-color: #6071E3; color: #6071E3; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .main-header { padding: 0 20px !important; height: 56px !important; }
            .main-logo img { height: 36px !important; }
            .main-nav { gap: 20px !important; }
            .main-nav a { font-size: 13px !important; }
            .welcome-title { font-size: 36px; margin-bottom: 50px; }
            .service-cards { gap: 25px; }
            .service-card { width: 100%; max-width: 350px; padding: 45px 35px; }
            .service-card img { width: 140px; height: 140px; }
            .service-card-title { font-size: 20px; }
            .subtitle { font-size: 20px; }
            .back-btn { padding: 18px 70px; font-size: 19px; }
            .sub-card { width: 140px; padding: 28px 20px; }
            .sub-card-icon { font-size: 38px; }
            .sub-card-title { font-size: 14px; }
        }
    </style>
</head>
<body>

<div th:replace="~{layout/navbar :: navbar}"></div>

<div id="weather-widget" class="weather-widget">
    <span class="weather-icon" id="weather-icon">🌤️</span>
    <span class="weather-temp" id="weather-temp">--</span>
    <span class="weather-desc" id="weather-desc"></span>
</div>

<!-- 스파클 레이어 -->
<div class="sparkle-layer">
    <span class="sp" style="top:14%;left:7%;animation-delay:0s;">✨</span>
    <span class="sp" style="top:22%;right:9%;animation-delay:1.2s;">✨</span>
    <span class="sp" style="bottom:28%;left:11%;animation-delay:0.7s;">✨</span>
    <span class="sp" style="bottom:18%;right:8%;animation-delay:2s;">✨</span>
    <span class="sp" style="top:55%;left:4%;animation-delay:1.5s;font-size:13px;">✦</span>
    <span class="sp" style="top:38%;right:5%;animation-delay:0.4s;font-size:13px;">✦</span>
</div>

<div class="hero-content">
    <h1 class="welcome-title">
        <span th:text="${session.SS_USER_NAME}">사용자</span>님,<br>
        오늘도 독서를 시작해볼까요?
    </h1>

    <div class="service-cards">
        <a th:href="@{/book/register}" class="service-card">
            <img th:src="@{/images/image 8.png}" alt="책 등록하기">
            <div class="service-card-title">책 등록하기</div>
        </a>
        <a th:href="@{/ranking}" class="service-card">
            <img th:src="@{/images/image 11.png}" alt="랭킹 보기">
            <div class="service-card-title">랭킹 보기</div>
        </a>
        <div class="service-card" onclick="openAiModal()">
            <img th:src="@{/images/image 10.png}" alt="독서 스튜디오">
            <div class="service-card-title">독서 스튜디오</div>
        </div>
    </div>

    <p class="subtitle">책과 함께하는 새로운 독서 경험</p>
    <a href="javascript:history.back()" class="back-btn">뒤로 가기</a>
</div>

<!-- AI 독서 서브메뉴 모달 -->
<div class="modal-bg" id="aiModal" onclick="closeAiModal(event)">
    <div class="modal">
        <div style="font-size:11px; font-weight:700; color:#6071E3; letter-spacing:.1em;
                    text-transform:uppercase; margin-bottom:8px;">FROM READING</div>
        <div class="modal-title">독서 스튜디오</div>
        <div class="modal-desc">원하는 독서 경험을 선택해보세요</div>

        <div class="studio-section">
            <div class="studio-section-label">
                <span class="studio-section-bar blue"></span>
                <span class="studio-section-text">AI 기능</span>
                <span class="studio-section-badge blue">OpenAI · Claude</span>
            </div>
            <div class="ai-cards">
                <a th:href="@{/review/create}" class="sub-card">
                    <div class="sub-card-icon">✍️</div>
                    <div class="sub-card-title">AI 독후감</div>
                    <div class="sub-card-desc">OpenAI 기반<br>감성 독후감 생성</div>
                </a>
                <a th:href="@{/image/create}" class="sub-card">
                    <div class="sub-card-icon">🎭</div>
                    <div class="sub-card-title">AI 이미지 생성</div>
                    <div class="sub-card-desc">Claude AI 기반<br>책 속 주인공 변환</div>
                </a>
            </div>
        </div>

        <div class="studio-section" style="margin-bottom:28px;">
            <div class="studio-section-label">
                <span class="studio-section-bar amber"></span>
                <span class="studio-section-text">도서 추천</span>
                <span class="studio-section-badge amber">알라딘 API</span>
            </div>
            <a th:href="@{/book/recommend}" class="recommend-card">
                <div class="recommend-card-icon">📚</div>
                <div>
                    <div class="recommend-card-title">맞춤 도서 추천</div>
                    <div class="recommend-card-desc">작가 · 장르 기반 큐레이션 · 알라딘 베스트셀러</div>
                </div>
                <div class="recommend-card-arrow">›</div>
            </a>
        </div>

        <button class="modal-close-btn" onclick="closeAiModal()">닫기</button>
    </div>
</div>

<script>
    function openAiModal() {
        document.getElementById('aiModal').classList.add('show');
    }

    function closeAiModal(e) {
        if (e && e.target !== document.getElementById('aiModal')) return;
        document.getElementById('aiModal').classList.remove('show');
    }

    // 오늘 날씨(초단기예보 첫 시간대) 위젯 표시
    (function loadWeatherWidget() {
        const SKY_ICON = { "맑음": "☀️", "구름많음": "⛅", "흐림": "☁️" };
        const PTY_ICON = { "비": "🌧️", "비/눈": "🌨️", "눈": "❄️", "소나기": "🌦️" };

        fetch('/weather/forecast', { method: 'POST' })
            .then((res) => res.ok ? res.json() : Promise.reject())
            .then((forecasts) => {
                if (!Array.isArray(forecasts) || forecasts.length === 0) return;

                const now = forecasts[0];
                const hasRain = now.precipitationType && now.precipitationType !== "없음";
                const icon = hasRain ? (PTY_ICON[now.precipitationType] || "🌦️")
                                     : (SKY_ICON[now.skyCondition] || "🌤️");

                document.getElementById('weather-icon').textContent = icon;
                document.getElementById('weather-temp').textContent = now.temperature + '°C';
                document.getElementById('weather-desc').textContent =
                    hasRain ? now.precipitationType : now.skyCondition;
                document.getElementById('weather-widget').style.display = 'inline-flex';
            })
            .catch(() => {});
    })();
</script>

</body>
</html>
