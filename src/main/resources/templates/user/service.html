<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서비스 시작 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: url('/images/library.png') center/cover no-repeat;
            font-family: 'Nanum Gothic', sans-serif;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 80px !important;
            height: 100px !important;
            background: white;
            border-bottom: 1px solid #eee;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .main-logo { text-decoration: none; display: flex; align-items: center; }
        .main-logo img { height: 80px !important; }
        .main-nav { display: flex; align-items: center; gap: 70px !important; }
        .main-nav a {
            color: #333 !important;
            text-decoration: none;
            font-size: 20px !important;
            font-weight: 500;
            transition: color 0.2s;
        }
        .main-nav a:hover { color: #6071E3 !important; font-weight: 700; }
        .header-logout-btn {
            background: #6071E3 !important;
            border: none;
            color: white !important;
            padding: 14px 40px !important;
            border-radius: 30px !important;
            cursor: pointer;
            font-size: 18px !important;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }
        .header-logout-btn:hover { background: #4f5fd4 !important; transform: translateY(-2px); }

        .hero-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 100px);
            padding: 60px 20px;
            text-align: center;
        }

        .welcome-title {
            font-size: 52px;
            font-weight: 700;
            color: white;
            text-shadow: 0 3px 12px rgba(0,0,0,0.6);
            margin-bottom: 70px;
            font-family: 'Nanum Myeongjo', serif;
            line-height: 1.4;
        }

        .service-cards {
            display: flex;
            gap: 50px;
            margin-bottom: 60px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .service-card {
            background: white;
            border-radius: 28px;
            padding: 60px 50px;
            width: 360px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.18);
        }
        .service-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 20px 50px rgba(96,113,227,0.35);
        }
        .service-card img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 24px;
        }
        .service-card-title { font-size: 24px; font-weight: 700; color: #333; }

        .subtitle {
            font-size: 26px;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
            margin-bottom: 50px;
            font-weight: 600;
        }

        .back-btn {
            background: #6071E3;
            color: white;
            border: none;
            padding: 22px 90px;
            border-radius: 50px;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(96,113,227,0.45);
        }
        .back-btn:hover {
            background: #4f5fd4;
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(96,113,227,0.55);
        }

        /* ── AI 독서 서브메뉴 모달 ── */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-bg.show { display: flex; }

        .modal {
            background: white;
            border-radius: 28px;
            padding: 48px 40px;
            max-width: 700px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            animation: fadeUp 0.3s ease;
            text-align: center;
        }

        .modal-title {
            font-size: 26px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 15px;
            color: #888;
            margin-bottom: 40px;
        }

        .sub-cards {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .sub-card {
            background: #f8f9ff;
            border: 2px solid #e4e7f0;
            border-radius: 20px;
            padding: 36px 28px;
            width: 180px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s;
        }
        .sub-card:hover {
            border-color: #6071E3;
            background: #eef1fe;
            transform: translateY(-6px);
            box-shadow: 0 10px 28px rgba(96,113,227,0.2);
        }

        .sub-card-icon { font-size: 48px; margin-bottom: 14px; }

        .sub-card-title {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            line-height: 1.4;
        }

        .modal-close-btn {
            background: none;
            border: 2px solid #ddd;
            border-radius: 50px;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Nanum Gothic', sans-serif;
        }
        .modal-close-btn:hover { border-color: #6071E3; color: #6071E3; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .main-header { padding: 0 30px !important; height: 85px !important; }
            .main-logo img { height: 65px !important; }
            .main-nav { gap: 35px !important; }
            .main-nav a { font-size: 17px !important; }
            .welcome-title { font-size: 36px; margin-bottom: 50px; }
            .service-cards { gap: 25px; }
            .service-card { width: 100%; max-width: 350px; padding: 45px 35px; }
            .service-card img { width: 140px; height: 140px; }
            .service-card-title { font-size: 20px; }
            .subtitle { font-size: 20px; }
            .back-btn { padding: 18px 70px; font-size: 19px; }
            .sub-card { width: 140px; padding: 28px 20px; }
            .sub-card-icon { font-size: 38px; }
            .sub-card-title { font-size: 14px; }
        }
    </style>
</head>
<body>

<header class="main-header">
    <a href="/static" class="main-logo">
        <img th:src="@{/images/logo.png}" alt="from">
    </a>
    <div style="display:flex; align-items:center; gap:70px;">
        <nav class="main-nav">
            <a th:href="@{/book/register}">책 등록</a>
            <a th:href="@{/templates/ranking}">랭킹</a>
            <a th:href="@{/review/create}">AI독서</a>
            <a th:href="@{/user/mypage}">마이페이지</a>
        </nav>
        <form th:action="@{/user/logout}" method="post" style="display:inline;">
            <button type="submit" class="header-logout-btn">로그아웃</button>
        </form>
    </div>
</header>

<div class="hero-content">
    <h1 class="welcome-title">
        <span th:text="${session.SS_USER_NAME}">사용자</span>님 어서오세요!
        어떤 서비스를 이용하고 싶으신가요?
    </h1>

    <div class="service-cards">
        <a th:href="@{/book/register}" class="service-card">
            <img th:src="@{/images/image}" alt="책 등록하기">
            <div class="service-card-title">책 등록하기</div>
        </a>
        <a th:href="@{/templates/ranking}" class="service-card">
            <img th:src="@{/images/image}" alt="랭킹 보기">
            <div class="service-card-title">랭킹 보기</div>
        </a>
        <!-- AI 독서 → 클릭 시 모달 오픈 -->
        <div class="service-card" onclick="openAiModal()">
            <img th:src="@{/images/image}" alt="AI 독서">
            <div class="service-card-title">AI 독서</div>
        </div>
    </div>

    <p class="subtitle">책을 등록하여 ai독후감을 생성해보세요!</p>
    <a href="javascript:history.back()" class="back-btn">뒤로 가기</a>
</div>

<!-- AI 독서 서브메뉴 모달 -->
<div class="modal-bg" id="aiModal" onclick="closeAiModal(event)">
    <div class="modal">
        <div class="modal-title">AI 독서</div>
        <div class="modal-desc">이용할 서비스를 선택해주세요</div>

        <div class="sub-cards">
            <a th:href="@{/review/create}" class="sub-card">
                <div class="sub-card-icon">📝</div>
                <div class="sub-card-title">AI 독후감</div>
            </a>
            <a th:href="@{/image/create}" class="sub-card">
                <div class="sub-card-icon">🎨</div>
                <div class="sub-card-title">책 속 주인공</div>
            </a>
            <a th:href="@{/book/recommend}" class="sub-card">
                <div class="sub-card-icon">🤖</div>
                <div class="sub-card-title">책 추천</div>
            </a>
        </div>

        <button class="modal-close-btn" onclick="closeAiModal()">닫기</button>
    </div>
</div>

<script>
    function openAiModal() {
        document.getElementById('aiModal').classList.add('show');
    }

    function closeAiModal(e) {
        if (e && e.target !== document.getElementById('aiModal')) return;
        document.getElementById('aiModal').classList.remove('show');
    }
</script>

</body>
</html>
