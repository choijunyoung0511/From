<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: url('/images/library.png') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Nanum Myeongjo', serif;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .login-card h2 {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #6071E3;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #6071E3;
        }

        .error-msg {
            display: block;
            color: #e53935;
            font-size: 12px;
            margin-top: 4px;
            min-height: 16px;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: #6071E3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #4f5fd4;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #ccc;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #eee;
        }

        .btn-kakao {
            display: block;
            width: 100%;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
        }
        .btn-kakao img {
            width: 100%;
            border-radius: 8px;
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }

        .form-footer a {
            color: #6071E3;
            text-decoration: none;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>로그인</h2>

    <div class="form-group">
        <input type="text" id="username" class="form-control" placeholder="아이디를 입력해주세요.">
        <span class="error-msg" id="username-error"></span>
    </div>

    <div class="form-group">
        <input type="password" id="password" class="form-control" placeholder="비밀번호를 입력해주세요.">
        <span class="error-msg" id="password-error"></span>
    </div>

    <button class="btn-login" onclick="doLogin()">로그인</button>

    <!-- 구분선 -->
    <div class="divider">또는</div>

    <!-- 카카오 로그인 버튼 -->
    <a th:href="@{/user/kakao/login}">
        <img th:src="@{/images/kakao_login_medium_narrow.png}"
             src="/images/kakao_login_medium.png"
             style="width:100%; border-radius:8px; cursor:pointer;">
    </a>

    <div class="form-footer">
        <a th:href="@{/user/signup}">회원가입</a>
        &nbsp;|&nbsp;
        <a th:href="@{/user/findId}">아이디 찾기</a>
        &nbsp;|&nbsp;
        <a th:href="@{/user/findPassword}">비밀번호 찾기</a>
    </div>
</div>

<!-- 로그인 실패 모달 -->
<div class="modal-overlay" id="errorModal">
    <div class="modal-box">
        <p id="errorMsg">⚠️ 아이디 혹은 비밀번호가 틀렸습니다.</p>
        <button class="btn btn-primary" onclick="closeModal()">확인</button>
    </div>
</div>

<script>
    function doLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const usernameError = document.getElementById('username-error');
        const passwordError = document.getElementById('password-error');

        usernameError.textContent = '';
        passwordError.textContent = '';

        if (!username) { usernameError.textContent = '아이디를 입력해주세요.'; return; }
        if (!password) { passwordError.textContent = '비밀번호를 입력해주세요.'; return; }

        fetch('/user/loginProc', {  // ← /login → /loginProc
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `userId=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`  // ← username → userId
        })
            .then(res => res.json())
            .then(data => {
                if (data.result === 1) {  // ← data.success → data.result === 1
                    window.location.href = '/user/service';
                } else {
                    document.getElementById('errorModal').classList.add('show');
                }
            });
    }

    function closeModal() {
        document.getElementById('errorModal').classList.remove('show');
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doLogin();
    });
</script>
</body>
</html>
