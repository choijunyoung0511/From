<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        body {
            flex-direction: row;
            overflow: hidden;
        }

        .page-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .float-shape {
            position: absolute;
            border-radius: 34px;
            background: linear-gradient(145deg, #5cbcff, #2463ff);
            box-shadow: inset 0 2px 10px rgba(255,255,255,0.3), 0 30px 60px rgba(37,99,235,0.20);
            opacity: 0.88;
        }
        .shape-1 { width: 420px; height: 420px; top: 110px; left: -120px; transform: rotate(-24deg); }
        .shape-2 { width: 600px; height: 300px; top: -40px; right: -80px; transform: rotate(-16deg); }
        .shape-3 { width: 280px; height: 200px; bottom: 60px; right: 180px; transform: rotate(-20deg); }

        .auth-wrap {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 80px;
            width: min(1080px, calc(100% - 48px));
            min-height: 100vh;
            padding: 60px 0;
        }

        .auth-left {
            flex: 1;
        }
        .auth-left .logo-link {
            display: inline-block;
            margin-bottom: 40px;
        }
        .auth-left .logo-link img { height: 56px; }
        .auth-kicker {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #2563eb;
            margin-bottom: 14px;
        }
        .auth-left h1 {
            margin: 0 0 20px;
            font-size: clamp(30px, 4vw, 50px);
            line-height: 1.22;
            letter-spacing: -0.05em;
            color: #0f172a;
        }
        .auth-left p {
            margin: 0;
            color: #4b5563;
            font-size: 17px;
            line-height: 1.85;
        }

        .auth-card {
            width: 420px;
            flex-shrink: 0;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: 28px;
            padding: 48px 44px;
            box-shadow: 0 32px 80px rgba(37,99,235,0.16), 0 8px 24px rgba(0,0,0,0.06);
        }
        .auth-card-title {
            font-size: 22px;
            font-weight: 800;
            color: #1e3a5f;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-group { margin-bottom: 16px; }
        .form-control {
            border-color: rgba(37,99,235,0.18);
            background: rgba(255,255,255,0.90);
        }
        .form-control:focus {
            border-color: #2563eb;
        }
        .error-msg {
            display: block;
            color: #e53935;
            font-size: 13px;
            margin-top: 4px;
            min-height: 16px;
        }

        .btn-auth {
            width: 100%;
            height: 54px;
            margin-top: 8px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #5da8ff, #2563eb);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(37,99,235,0.25);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Jua', sans-serif;
        }
        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 40px rgba(37,99,235,0.32);
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }
        .auth-footer a { color: #2563eb; text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }

        @media (max-width: 820px) {
            .auth-left { display: none; }
            body { overflow: auto; }
            .auth-wrap { justify-content: center; min-height: 100vh; padding: 40px 0; }
            .auth-card { width: min(420px, 100%); }
        }
    </style>
</head>
<body class="auth-page">

<div class="page-bg">
    <div class="float-shape shape-1"></div>
    <div class="float-shape shape-2"></div>
    <div class="float-shape shape-3"></div>
</div>

<div class="auth-wrap">
    <div class="auth-left">
        <a th:href="@{/}" class="logo-link">
            <img th:src="@{/images/logo.png}" alt="FROM 로고">
        </a>
        <p class="auth-kicker">Welcome back</p>
        <h1>다시 만난<br>나의 독서 기록</h1>
        <p>기록해둔 감상과 AI 편지를<br>이어서 확인하세요.</p>
    </div>

    <div class="auth-card">
        <p class="auth-card-title">로그인</p>
        <form autocomplete="off" onsubmit="return false;">
            <div class="form-group">
                <input type="text" id="username" class="form-control" placeholder="아이디를 입력해주세요.">
                <span class="error-msg" id="username-error"></span>
            </div>
            <div class="form-group">
                <input type="password" id="password" class="form-control" placeholder="비밀번호를 입력해주세요.">
                <span class="error-msg" id="password-error"></span>
            </div>
            <button class="btn-auth" onclick="doLogin()">로그인</button>
        </form>
        <div class="auth-footer">
            <a th:href="@{/user/signup}">회원가입</a>
            &nbsp;|&nbsp;
            <a th:href="@{/user/findId}">아이디 찾기</a>
            &nbsp;|&nbsp;
            <a th:href="@{/user/findPassword}">비밀번호 찾기</a>
        </div>
    </div>
</div>

<!-- 로그인 실패 모달 -->
<div class="modal-overlay" id="errorModal">
    <div class="modal-box">
        <p id="errorMsg">아이디 혹은 비밀번호가 틀렸습니다.</p>
        <button class="btn btn-primary" onclick="closeModal()">확인</button>
    </div>
</div>

<script>
    /*
     * ── 로그인 전체 흐름 ────────────────────────────────────────────
     * [로그인-1] 브라우저에서 GET /user/login 요청
     * [로그인-2] UserInfoController.loginForm() → login.html 반환 (Thymeleaf 렌더링)
     * [로그인-3] 사용자가 아이디·비밀번호 입력 후 '로그인' 버튼 클릭 → doLogin() 호출
     * [로그인-4] 클라이언트 유효성 검사 (빈 값 체크)
     * [로그인-5] AJAX POST /user/loginProc — userId, password를 폼 인코딩으로 전송
     * [로그인-6] UserInfoController.loginProc() 수신
     *            → UserInfoService.login() 호출
     *              → DB에서 userId로 유저 조회
     *              → SHA-256(입력 비밀번호) vs DB 저장 해시 비교
     *              → 일치하면 UserInfoDto 반환
     * [로그인-7] 컨트롤러가 세션에 SS_USER_ID, SS_USER_NAME 저장 → MsgDto(result=1) 반환
     * [로그인-8] result=1 → /user/service 이동 / 실패 → 에러 모달 표시
     * [로그인-9] 이후 보호 경로(/book/**, /review/**, /ranking/** 등) 접근 시
     *            LoginInterceptor.preHandle()이 세션의 SS_USER_ID 존재 여부를 검사
     * ───────────────────────────────────────────────────────────────
     */

    // [로그인-3] 로그인 버튼 클릭 또는 Enter 키 → doLogin() 진입
    function doLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const usernameError = document.getElementById('username-error');
        const passwordError = document.getElementById('password-error');
        usernameError.textContent = '';
        passwordError.textContent = '';

        // [로그인-4] 클라이언트 유효성 검사 — 빈 값이면 에러 메시지 표시 후 중단
        if (!username) { usernameError.textContent = '아이디를 입력해주세요.'; return; }
        if (!password) { passwordError.textContent = '비밀번호를 입력해주세요.'; return; }

        // [로그인-5] AJAX POST /user/loginProc — 서버로 아이디·비밀번호 전송
        fetch('/user/loginProc', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `userId=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
        })
            .then(res => res.json())
            .then(data => {
                // [로그인-8] 서버 응답 처리
                if (data.result === 1) {
                    window.location.href = '/user/service'; // 로그인 성공 → 서비스 페이지 이동
                } else {
                    document.getElementById('errorModal').classList.add('show'); // 실패 → 에러 모달
                }
            });
    }
    function closeModal() {
        document.getElementById('errorModal').classList.remove('show');
    }
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doLogin(); // [로그인-3] Enter 키도 로그인 트리거
    });
</script>
</body>
</html>
