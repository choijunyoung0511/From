<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랭킹 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        /* ── 헤더 ── */
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 80px !important;
            height: 100px !important;
            background: white;
            border-bottom: 1px solid #eee;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .main-logo { text-decoration: none; display: flex; align-items: center; }
        .main-logo img { height: 80px !important; }
        .main-nav { display: flex; align-items: center; gap: 70px !important; }
        .main-nav a {
            color: #333 !important;
            text-decoration: none;
            font-size: 20px !important;
            font-weight: 500;
            transition: color 0.2s;
        }
        .main-nav a:hover { color: #6071E3 !important; font-weight: 700; }
        .header-logout-btn {
            background: #6071E3 !important;
            border: none;
            color: white !important;
            padding: 14px 40px !important;
            border-radius: 30px !important;
            cursor: pointer;
            font-size: 18px !important;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }
        .header-logout-btn:hover { background: #4f5fd4 !important; transform: translateY(-2px); }

        /* ── 랭킹 ── */
        .ranking-table { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .ranking-table table { width: 100%; border-collapse: collapse; }
        .ranking-table th { background: #1E3A5F; color: white; padding: 14px 20px; font-size: 14px; text-align: left; }
        .ranking-table td { padding: 14px 20px; font-size: 14px; border-bottom: 1px solid #f0ebe6; }
        .ranking-table tr:last-child td { border-bottom: none; }
        .ranking-table tr:hover td { background: #faf7f4; }
        .rank-badge { font-weight: 700; font-size: 16px; }
        .rank-1 { color: #FFB800; }
        .rank-2 { color: #AAAAAA; }
        .rank-3 { color: #CD7F32; }
        .my-row td { background: #f0f5ff; font-weight: 600; }
        .empty-msg { text-align: center; padding: 60px; color: #999; font-size: 15px; }
        .week-label { font-size: 13px; color: #888; margin-bottom: 16px; }
    </style>
</head>
<body>

<header class="main-header">
    <a th:href="@{/user/service}" class="main-logo">
        <img th:src="@{/images/logo.png}" alt="from">
    </a>
    <div style="display:flex; align-items:center; gap:70px;">
        <nav class="main-nav">
            <a th:href="@{/book/register}">책 등록</a>
            <a th:href="@{/ranking}" class="active">랭킹</a>
            <a th:href="@{/review/create}">AI독서</a>
            <a th:href="@{/user/mypage}">마이페이지</a>
        </nav>
        <form th:action="@{/user/logout}" method="post" style="display:inline;">
            <button type="submit" class="header-logout-btn">로그아웃</button>
        </form>
    </div>
</header>

<div class="page-container">
    <h2 class="page-header">주간 랭킹</h2>
    <p class="week-label" th:text="${weekLabel}">이번 주 랭킹</p>

    <div class="ranking-table" th:if="${#lists.isEmpty(rankings)}">
        <p class="empty-msg">아직 집계된 랭킹이 없습니다.</p>
    </div>

    <div class="ranking-table" th:unless="${#lists.isEmpty(rankings)}">
        <table>
            <thead>
            <tr>
                <th>순위</th>
                <th>닉네임</th>
                <th>독서량</th>
                <th>연속 독서일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${rankings}"
                th:classappend="${session.SS_USER_ID != null and r.userId == session.SS_USER_ID} ? 'my-row'">
                <td>
                    <!-- RankingDto 필드: rankPosition -->
                    <span class="rank-badge"
                          th:classappend="${r.rankPosition == 1} ? 'rank-1' : (${r.rankPosition == 2} ? 'rank-2' : (${r.rankPosition == 3} ? 'rank-3' : ''))"
                          th:text="${r.rankPosition}">1</span>
                </td>
                <!-- RankingDto 필드: userName -->
                <td th:text="${r.userName}">닉네임</td>
                <!-- RankingDto 필드: weeklyBookCount -->
                <td th:text="${r.weeklyBookCount} + '권'">0권</td>
                <td th:text="${r.consecutiveDays} + '일'">0일</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
