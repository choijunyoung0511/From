<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>책 등록 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        /* ── 검색 래퍼 ── */
        .search-wrap { max-width: 640px; margin: 40px auto 0; position: relative; }

        /* ── 검색바 ── */
        .search-bar {
            display: flex; align-items: center;
            border: 2px solid #6071E3; border-radius: 30px;
            overflow: hidden; background: white;
            transition: box-shadow 0.2s;
        }
        .search-bar:focus-within { box-shadow: 0 0 0 3px rgba(96,113,227,0.15); }
        .search-type {
            padding: 0 4px 0 16px; border: none; outline: none;
            font-size: 13px; color: #555; background: transparent;
            cursor: pointer; font-family: 'Jua', sans-serif;
            white-space: nowrap;
        }
        .search-divider { width: 1px; height: 20px; background: #ddd; margin: 0 4px; flex-shrink: 0; }
        .search-input {
            flex: 1; padding: 14px 12px; border: none; outline: none;
            font-size: 15px; font-family: 'Jua', sans-serif;
            min-width: 0;
        }
        .search-btn {
            padding: 0 20px; background: none; border: none;
            cursor: pointer; font-size: 20px; color: #6071E3;
            flex-shrink: 0;
        }

        /* ── 드롭다운 팝업 ── */
        .search-dropdown {
            display: none;
            position: absolute; top: calc(100% + 8px); left: 0; right: 0;
            background: white; border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.14);
            z-index: 1000; overflow: hidden;
        }
        .search-dropdown.open { display: block; }

        .dropdown-section { padding: 18px 20px 14px; }
        .dropdown-section + .dropdown-section { border-top: 1px solid #f2f2f2; }

        .section-title {
            font-size: 12px; font-weight: 700; color: #999;
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .section-title .clear-all {
            font-size: 11px; color: #bbb; cursor: pointer;
            font-weight: 400; text-transform: none; letter-spacing: 0;
        }
        .section-title .clear-all:hover { color: #888; }

        /* 최근 검색어 */
        .recent-empty { font-size: 13px; color: #bbb; padding: 4px 0 8px; }
        .recent-list { display: flex; flex-direction: column; gap: 2px; }
        .recent-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 7px 8px; border-radius: 8px; cursor: pointer;
            transition: background 0.15s;
        }
        .recent-item:hover { background: #f7f7f7; }
        .recent-item-left { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #333; }
        .recent-icon { font-size: 13px; color: #bbb; }
        .recent-remove { font-size: 12px; color: #ccc; cursor: pointer; padding: 2px 4px; }
        .recent-remove:hover { color: #888; }

        /* 지금 베스트 */
        .best-slider-wrap { position: relative; }
        .best-list {
            display: flex; gap: 14px; overflow-x: auto;
            scroll-behavior: smooth; padding: 2px 2px 6px;
            scrollbar-width: none;
        }
        .best-list::-webkit-scrollbar { display: none; }
        .best-item {
            display: flex; flex-direction: column; align-items: center;
            gap: 8px; cursor: pointer; flex-shrink: 0; width: 72px;
            transition: transform 0.15s;
        }
        .best-item:hover { transform: translateY(-2px); }
        .best-rank-wrap { position: relative; width: 64px; }
        .best-cover {
            width: 64px; height: 90px; border-radius: 6px;
            object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            display: block;
        }
        .best-cover-placeholder {
            width: 64px; height: 90px; border-radius: 6px;
            background: linear-gradient(135deg, #e8e0d5, #d4c9bd);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
        }
        .best-rank {
            position: absolute; top: 4px; left: 4px;
            background: rgba(0,0,0,0.65); color: white;
            font-size: 11px; font-weight: 700; border-radius: 4px;
            padding: 1px 5px; line-height: 1.5;
        }
        .best-rank.top3 { background: #6071E3; }
        .best-title {
            font-size: 11px; color: #444; text-align: center;
            line-height: 1.4; max-width: 72px;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .slider-btn {
            position: absolute; top: 38px;
            width: 28px; height: 28px; border-radius: 50%;
            background: white; border: 1px solid #e0e0e0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 13px; color: #555;
            z-index: 2; transition: background 0.15s;
        }
        .slider-btn:hover { background: #f0f2ff; border-color: #6071E3; color: #6071E3; }
        .slider-btn.prev { left: -14px; }
        .slider-btn.next { right: -14px; }

        /* 추천 키워드 */
        .suggest-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .suggest-tag {
            padding: 5px 14px; border-radius: 20px;
            background: #f0f2ff; color: #6071E3;
            border: 1px solid #dde0f8; font-size: 13px;
            cursor: pointer; transition: all 0.15s;
        }
        .suggest-tag:hover { background: #6071E3; color: white; border-color: #6071E3; }

        /* 닫기 버튼 */
        .dropdown-footer {
            padding: 10px 20px 14px; text-align: right; border-top: 1px solid #f2f2f2;
        }
        .dropdown-close {
            font-size: 12px; color: #bbb; cursor: pointer;
            padding: 4px 10px; border: 1px solid #e8e8e8;
            border-radius: 12px; background: none;
            font-family: 'Jua', sans-serif;
            transition: all 0.15s;
        }
        .dropdown-close:hover { color: #666; border-color: #ccc; }

        /* ── 검색 결과 ── */
        .book-list { max-width: 640px; margin: 20px auto; }
        .book-item {
            display: flex; align-items: center; background: white;
            border-radius: 12px; padding: 16px 20px; margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); gap: 16px;
        }
        .book-cover-sm { width: 50px; height: 70px; border-radius: 4px; flex-shrink: 0; object-fit: cover; }
        .book-cover-placeholder-sm { width: 50px; height: 70px; background: #E0D5CC; border-radius: 4px; flex-shrink: 0; }
        .book-info { flex: 1; min-width: 0; }
        .book-title { font-size: 15px; font-weight: 700; color: #6071E3; margin-bottom: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .book-author { font-size: 13px; color: #888; }
        .register-btn {
            padding: 8px 20px; border: 1.5px solid #6071E3; border-radius: 20px;
            background: white; color: #6071E3; cursor: pointer; font-size: 13px;
            white-space: nowrap; transition: all 0.2s; font-family: 'Jua', sans-serif;
            flex-shrink: 0;
        }
        .register-btn:hover { background: #6071E3; color: white; }

        /* 반응형 */
        @media (max-width: 680px) {
            .search-wrap { margin: 20px 16px 0; }
            .book-list { margin: 16px; }
            .slider-btn.prev { left: -8px; }
            .slider-btn.next { right: -8px; }
        }
    </style>
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="page-container">
    <div class="search-wrap" id="search-wrap">

        <!-- 검색바 -->
        <div class="search-bar">
            <select class="search-type" id="search-type">
                <option value="Keyword">통합검색</option>
                <option value="Title">제목</option>
                <option value="Author">저자</option>
            </select>
            <div class="search-divider"></div>
            <input type="text" id="search-input" class="search-input"
                   placeholder="책 제목, 저자를 검색해보세요."
                   autocomplete="off"
                   onfocus="openDropdown()"
                   onkeydown="if(event.key==='Enter') doSearch()">
            <button class="search-btn" onclick="doSearch()">🔍</button>
        </div>

        <!-- 드롭다운 팝업 -->
        <div class="search-dropdown" id="search-dropdown">

            <!-- 최근 검색어 -->
            <div class="dropdown-section">
                <div class="section-title">
                    최근 검색어
                    <span class="clear-all" onclick="clearAllRecent()">전체 삭제</span>
                </div>
                <div id="recent-container">
                    <div class="recent-empty">최근 검색어가 없습니다.</div>
                </div>
            </div>

            <!-- 지금 베스트 -->
            <div class="dropdown-section">
                <div class="section-title">지금 베스트</div>
                <div class="best-slider-wrap">
                    <button class="slider-btn prev" onclick="slideLeft()">&#8249;</button>
                    <div class="best-list" id="best-list">
                        <div style="font-size:13px; color:#bbb; padding: 20px 0;">불러오는 중...</div>
                    </div>
                    <button class="slider-btn next" onclick="slideRight()">&#8250;</button>
                </div>
            </div>

            <!-- 추천 키워드 -->
            <div class="dropdown-section">
                <div class="section-title">추천 검색어</div>
                <div class="suggest-tags" id="suggest-tags"></div>
            </div>

            <!-- 닫기 -->
            <div class="dropdown-footer">
                <button class="dropdown-close" onclick="closeDropdown()">닫기</button>
            </div>
        </div>
    </div>

    <div class="book-list" id="book-list"></div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <p id="modal-msg">등록되었습니다.</p>
        <button class="btn btn-primary" onclick="closeModal()">확인</button>
    </div>
</div>

<script>
    const SUGGEST_KEYWORDS = ['소설', '자기계발', '에세이', '역사', '과학', '철학', '심리학', '경제경영', '판타지', '시집'];
    const MAX_RECENT = 8;

    /* ── localStorage ── */
    function getRecent() {
        return JSON.parse(localStorage.getItem('book_recent') || '[]');
    }
    function saveRecent(keyword) {
        let list = getRecent().filter(k => k !== keyword);
        list.unshift(keyword);
        if (list.length > MAX_RECENT) list = list.slice(0, MAX_RECENT);
        localStorage.setItem('book_recent', JSON.stringify(list));
        renderRecent();
    }
    function removeRecent(keyword, e) {
        e.stopPropagation();
        const list = getRecent().filter(k => k !== keyword);
        localStorage.setItem('book_recent', JSON.stringify(list));
        renderRecent();
    }
    function clearAllRecent() {
        localStorage.removeItem('book_recent');
        renderRecent();
    }

    /* ── 렌더링 ── */
    function renderRecent() {
        const recent = getRecent();
        const container = document.getElementById('recent-container');
        if (recent.length === 0) {
            container.innerHTML = '<div class="recent-empty">최근 검색어가 없습니다.</div>';
            return;
        }
        container.innerHTML = `<div class="recent-list">${
            recent.map(k => `
                <div class="recent-item" onclick="clickKeyword('${k.replace(/'/g, "\\'")}')">
                    <span class="recent-item-left">
                        <span class="recent-icon">🕐</span>${k}
                    </span>
                    <span class="recent-remove" onclick="removeRecent('${k.replace(/'/g, "\\'")}', event)">✕</span>
                </div>
            `).join('')
        }</div>`;
    }

    function renderSuggest() {
        document.getElementById('suggest-tags').innerHTML = SUGGEST_KEYWORDS.map(k =>
            `<span class="suggest-tag" onclick="clickKeyword('${k}')">${k}</span>`
        ).join('');
    }

    function renderBest(books) {
        const list = document.getElementById('best-list');
        if (!books || books.length === 0) {
            list.innerHTML = '<div style="font-size:13px;color:#bbb;padding:20px 0;">베스트 정보를 불러올 수 없습니다.</div>';
            return;
        }
        list.innerHTML = books.slice(0, 10).map((book, i) => `
            <div class="best-item" onclick="clickKeyword('${book.title.replace(/'/g, "\\'")}')">
                <div class="best-rank-wrap">
                    ${book.cover
                        ? `<img src="${book.cover}" class="best-cover" alt="표지" onerror="this.style.display='none'">`
                        : `<div class="best-cover-placeholder">📚</div>`}
                    <span class="best-rank ${i < 3 ? 'top3' : ''}">${i + 1}</span>
                </div>
                <div class="best-title">${book.title}</div>
            </div>
        `).join('');
    }

    /* ── 베스트 로딩 ── */
    let bestLoaded = false;
    function loadBest() {
        if (bestLoaded) return;
        bestLoaded = true;
        fetch('/book/bestseller')
            .then(res => res.json())
            .then(books => renderBest(books))
            .catch(() => renderBest(null));
    }

    /* ── 슬라이더 ── */
    function slideLeft() {
        document.getElementById('best-list').scrollBy({ left: -200, behavior: 'smooth' });
    }
    function slideRight() {
        document.getElementById('best-list').scrollBy({ left: 200, behavior: 'smooth' });
    }

    /* ── 드롭다운 열기/닫기 ── */
    function openDropdown() {
        document.getElementById('search-dropdown').classList.add('open');
        renderRecent();
        loadBest();
    }
    function closeDropdown() {
        document.getElementById('search-dropdown').classList.remove('open');
    }

    // 외부 클릭 시 닫기
    document.addEventListener('click', function(e) {
        const wrap = document.getElementById('search-wrap');
        if (!wrap.contains(e.target)) closeDropdown();
    });

    /* ── 검색 ── */
    function clickKeyword(keyword) {
        document.getElementById('search-input').value = keyword;
        doSearch();
    }

    function doSearch() {
        const query = document.getElementById('search-input').value.trim();
        if (!query) return;
        const type = document.getElementById('search-type').value;

        saveRecent(query);
        closeDropdown();
        document.getElementById('book-list').innerHTML =
            '<p style="text-align:center;color:#aaa;padding:30px;">검색 중...</p>';

        fetch(`/book/search?query=${encodeURIComponent(query)}&type=${encodeURIComponent(type)}`)
            .then(res => res.json())
            .then(books => {
                const list = document.getElementById('book-list');
                if (!books || books.length === 0) {
                    list.innerHTML = '<p style="text-align:center;color:#999;padding:40px;">검색 결과가 없습니다.</p>';
                    return;
                }
                list.innerHTML = books.map(book => `
                    <div class="book-item">
                        ${book.cover
                            ? `<img src="${book.cover}" class="book-cover-sm" alt="표지">`
                            : `<div class="book-cover-placeholder-sm"></div>`}
                        <div class="book-info">
                            <div class="book-title">${book.title}</div>
                            <div class="book-author">${book.author || ''}</div>
                        </div>
                        <button class="register-btn" onclick="registerBook(
                            '${book.title.replace(/'/g, "\\'")}',
                            '${(book.author||'').replace(/'/g, "\\'")}',
                            '${(book.cover||'').replace(/'/g, "\\'")}',
                            '${(book.isbn||'').replace(/'/g, "\\'")}'
                        )">등록하기</button>
                    </div>
                `).join('');
            });
    }

    function registerBook(title, author, cover, isbn) {
        fetch('/book/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `title=${encodeURIComponent(title)}&author=${encodeURIComponent(author)}&cover=${encodeURIComponent(cover)}&isbn=${encodeURIComponent(isbn)}`
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('modal-msg').textContent = data.message || '등록되었습니다.';
            document.getElementById('modal').classList.add('show');
        });
    }

    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    // 초기 추천 키워드 렌더링
    renderSuggest();
</script>
</body>
</html>
