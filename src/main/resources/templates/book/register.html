<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>책 등록 - FROM</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        /* ════════════════════════════════════
           BASE — 크림 그라디언트 배경
        ════════════════════════════════════ */
        body {
            background: linear-gradient(to bottom, #F4F5F9, #EEF0F8 65%, #E8EAF4) !important;
            min-height: 100vh;
        }
        /* page-container 레이아웃 재정의 */
        .page-container { max-width: none; padding: 0; margin: 0; }

        /* ════════════════════════════════════
           [1] 히어로 감성 문구
        ════════════════════════════════════ */
        .page-hero {
            text-align: center;
            padding: 52px 24px 36px;
        }
        .hero-kicker {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(96,113,227,.08);
            color: #6071E3;
            border: 1px solid rgba(96,113,227,.2);
            border-radius: 99px;
            padding: 5px 14px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .04em;
            margin-bottom: 20px;
        }
        .hero-title {
            font-family: 'Hi Melody', cursive;
            font-size: 34px;
            color: #1A1A2E;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .hero-sub {
            font-size: 15px;
            color: #7A7899;
            line-height: 1.7;
        }

        /* ════════════════════════════════════
           검색 영역
        ════════════════════════════════════ */
        .search-zone {
            max-width: 680px;
            margin: 0 auto;
            padding: 0 20px 8px;
        }
        .search-wrap { position: relative; }

        /* 검색바 */
        .search-bar {
            display: flex;
            align-items: center;
            border: 2px solid rgba(67,97,238,.15);
            border-radius: 30px;
            background: #fff;
            box-shadow: 0 4px 22px rgba(0,0,0,.07);
            overflow: hidden;
            transition: border-color .2s, box-shadow .2s;
        }
        .search-bar:focus-within {
            border-color: #6071E3;
            box-shadow: 0 4px 24px rgba(96,113,227,.18);
        }
        .search-type {
            padding: 0 4px 0 18px;
            border: none; outline: none;
            font-size: 13px; color: #555577;
            background: transparent;
            cursor: pointer;
            font-family: 'Jua', sans-serif;
            white-space: nowrap;
        }
        .search-divider { width: 1px; height: 18px; background: rgba(67,97,238,.15); margin: 0 6px; flex-shrink: 0; }
        .search-input {
            flex: 1; padding: 16px 12px;
            border: none; outline: none;
            font-size: 15px; font-family: 'Jua', sans-serif;
            min-width: 0; background: transparent; color: #1A1A2E;
        }
        .search-input::placeholder { color: #AAAABC; }
        .search-btn {
            padding: 0 22px;
            background: none; border: none;
            cursor: pointer; font-size: 20px; color: #6071E3;
            flex-shrink: 0;
            transition: transform .15s;
        }
        .search-btn:hover { transform: scale(1.14); }

        /* ── 드롭다운 (최근검색 + 키워드만) ── */
        .search-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 10px);
            left: 0; right: 0;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,.11);
            z-index: 1000;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,.05);
        }
        .search-dropdown.open { display: block; }

        .dd-sec { padding: 16px 20px 14px; }
        .dd-sec + .dd-sec { border-top: 1px solid #EEEEF8; }

        .dd-label {
            font-size: 11px; font-weight: 700;
            color: #AAAABC; text-transform: uppercase;
            letter-spacing: .06em; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .dd-clear { font-size: 11px; color: #c8bfb3; cursor: pointer; font-weight: 400; text-transform: none; letter-spacing: 0; }
        .dd-clear:hover { color: #7A7899; }

        /* [3] 최근 검색어 — 축소 */
        .recent-empty { font-size: 13px; color: #c8bfb3; padding: 2px 0 4px; }
        .recent-list  { display: flex; flex-direction: column; gap: 1px; }
        .recent-item  {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 8px; border-radius: 8px; cursor: pointer;
            transition: background .15s;
        }
        .recent-item:hover { background: #F0F0F8; }
        .recent-left  { display: flex; align-items: center; gap: 9px; font-size: 13px; color: #1A1A2E; }
        .recent-clock { font-size: 12px; color: #c8bfb3; }
        .recent-del   { font-size: 11px; color: #d4c9bd; cursor: pointer; padding: 2px 5px; }
        .recent-del:hover { color: #7A7899; }

        /* [4] 추천 키워드 — pill + 애니메이션 */
        .suggest-tags { display: flex; flex-wrap: wrap; gap: 7px; }
        .suggest-tag {
            padding: 6px 15px; border-radius: 99px;
            background: #EEEEF8; color: #555577;
            border: 1px solid rgba(67,97,238,.12);
            font-size: 13px; cursor: pointer;
            font-family: 'Jua', sans-serif;
            transition: all .2s cubic-bezier(.25,.46,.45,.94);
        }
        .suggest-tag:hover {
            background: #6071E3; color: #fff;
            border-color: #6071E3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(96,113,227,.28);
        }

        .dd-footer { padding: 10px 20px 14px; border-top: 1px solid #EEEEF8; text-align: right; }
        .dd-close  {
            font-size: 12px; color: #c8bfb3; cursor: pointer;
            padding: 4px 13px; border: 1px solid rgba(67,97,238,.12);
            border-radius: 99px; background: none;
            font-family: 'Jua', sans-serif;
            transition: all .15s;
        }
        .dd-close:hover { color: #555577; border-color: #AAAABC; }

        /* [7] FROM 브랜드 카피 */
        .brand-copy {
            text-align: center;
            margin: 22px auto 0;
            max-width: 380px;
            font-family: 'Hi Melody', cursive;
            font-size: 15px;
            color: #AAAABC;
            line-height: 2;
        }

        /* ════════════════════════════════════
           검색 결과 영역
        ════════════════════════════════════ */
        .results-zone {
            max-width: 680px;
            margin: 24px auto 0;
            padding: 0 20px;
            display: none;
        }
        .results-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px;
        }
        .results-label { font-size: 14px; color: #7A7899; }
        .results-label strong { color: #1A1A2E; }
        .results-back {
            font-size: 12px; color: #9999B8; cursor: pointer;
            padding: 5px 13px; border: 1px solid rgba(67,97,238,.15);
            border-radius: 99px; background: none;
            font-family: 'Jua', sans-serif; transition: all .15s;
        }
        .results-back:hover { border-color: #6071E3; color: #6071E3; }

        .book-list {}
        .book-item {
            display: flex; align-items: center;
            background: #fff; border-radius: 14px;
            padding: 15px 20px; margin-bottom: 10px;
            box-shadow: 0 2px 14px rgba(0,0,0,.055);
            border: 1px solid rgba(0,0,0,.03);
            gap: 16px;
            transition: box-shadow .2s, transform .2s;
        }
        .book-item:hover { box-shadow: 0 5px 22px rgba(0,0,0,.1); transform: translateY(-1px); }
        .book-cover-sm {
            width: 54px; height: 76px;
            border-radius: 6px; object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(0,0,0,.13);
        }
        .book-cover-placeholder-sm {
            width: 54px; height: 76px;
            border-radius: 6px; flex-shrink: 0;
            background: linear-gradient(135deg,#e8e0d5,#d4c9bd);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .book-info { flex: 1; min-width: 0; }
        .book-title {
            font-size: 15px; font-weight: 700; color: #1A1A2E;
            margin-bottom: 4px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .book-author { font-size: 13px; color: #7A7899; }
        .register-btn {
            padding: 9px 20px;
            border: 1.5px solid #6071E3; border-radius: 99px;
            background: #fff; color: #6071E3;
            cursor: pointer; font-size: 13px; font-weight: 700;
            white-space: nowrap;
            font-family: 'Jua', sans-serif;
            flex-shrink: 0;
            transition: all .2s;
        }
        .register-btn:hover { background: #6071E3; color: #fff; box-shadow: 0 4px 14px rgba(96,113,227,.3); }

        /* ════════════════════════════════════
           [2] 베스트셀러 — 넷플릭스 스타일
        ════════════════════════════════════ */
        .best-zone { padding: 46px 0 60px; }
        .best-zone-inner { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

        .best-zone-header {
            display: flex; align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 26px;
        }
        .best-zone-title { font-size: 20px; font-weight: 700; color: #1A1A2E; margin-bottom: 4px; }
        .best-zone-sub   { font-size: 13px; color: #9999B8; }
        .best-live-badge {
            display: inline-flex; align-items: center; gap: 5px;
            background: #fff8e1; color: #9a6800;
            border: 1px solid #ffe082;
            border-radius: 99px; padding: 4px 12px;
            font-size: 11px; font-weight: 700;
        }
        .live-dot {
            width: 6px; height: 6px;
            border-radius: 50%; background: #f59e0b;
            animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.75)} }

        /* 스크롤 컨테이너 */
        .best-scroll-area { position: relative; }
        .best-scroll {
            display: flex; gap: 16px;
            overflow-x: auto; scroll-behavior: smooth;
            padding: 10px 4px 24px;
            scrollbar-width: none;
            scroll-snap-type: x mandatory;
        }
        .best-scroll::-webkit-scrollbar { display: none; }

        /* 슬라이더 버튼 */
        .bslider {
            position: absolute; top: 50%; transform: translateY(-90%);
            width: 40px; height: 40px;
            border-radius: 50%; background: #fff;
            border: 1px solid #e0d8d0;
            box-shadow: 0 4px 16px rgba(0,0,0,.12);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px; color: #555577;
            z-index: 2; transition: all .2s;
        }
        .bslider:hover { background: #6071E3; color: #fff; border-color: #6071E3; box-shadow: 0 4px 16px rgba(96,113,227,.3); }
        .bslider.prev { left: -20px; }
        .bslider.next { right: -20px; }

        /* ── 베스트 카드 ── */
        .best-card {
            flex-shrink: 0;
            width: 158px;
            cursor: pointer;
            scroll-snap-align: start;
            transition: transform .3s cubic-bezier(.25,.46,.45,.94);
        }
        .best-card:hover { transform: translateY(-8px) scale(1.025); }

        .best-card-img {
            position: relative;
            width: 100%; height: 222px;
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,.15);
            margin-bottom: 11px;
            background: linear-gradient(135deg,#e8e0d5,#d4c9bd);
        }
        .best-card-img img {
            width: 100%; height: 100%; object-fit: cover; display: block;
            transition: transform .4s ease;
        }
        .best-card:hover .best-card-img img { transform: scale(1.08); }

        /* 그라디언트 오버레이 + 랭크 숫자 */
        .best-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 88px;
            background: linear-gradient(to top, rgba(0,0,0,.72) 0%, transparent 100%);
            display: flex; align-items: flex-end;
            padding: 0 10px 8px;
        }
        .best-rank-num {
            font-size: 36px; font-weight: 900;
            color: rgba(255,255,255,.92);
            line-height: 1;
            text-shadow: 0 2px 12px rgba(0,0,0,.5);
            font-family: 'Georgia', 'Times New Roman', serif;
            letter-spacing: -1px;
        }
        .best-rank-num.top3 { color: #FFD98A; }

        .best-card-title {
            font-size: 13px; color: #1A1A2E;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .best-placeholder {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 38px;
        }

        /* 로딩 */
        .best-loading {
            display: flex; align-items: center; gap: 10px;
            padding: 16px 0; color: #AAAABC; font-size: 14px;
        }
        .ld { width:8px; height:8px; border-radius:50%; background:rgba(67,97,238,.15); animation:blink 1.2s ease-in-out infinite; }
        .ld:nth-child(2){animation-delay:.2s} .ld:nth-child(3){animation-delay:.4s}
        @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

        /* ════════════════════════════════════
           FROM Toast
        ════════════════════════════════════ */
        #from-toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-90px);
            background: #FFFBF8;
            border-left: 4px solid #6071E3;
            border-radius: 14px;
            padding: 14px 28px;
            box-shadow: 0 8px 36px rgba(100,60,20,.16), 0 0 0 1px rgba(212,149,106,.12);
            font-family: 'Jua', sans-serif;
            font-size: 14px;
            color: #1A1A2E;
            z-index: 99999;
            opacity: 0;
            transition: transform .38s cubic-bezier(.34,1.56,.64,1), opacity .38s;
            min-width: 230px;
            text-align: center;
            pointer-events: none;
        }
        #from-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        #from-toast .toast-title { font-weight: 700; margin-bottom: 3px; }
        #from-toast .toast-sub   { font-size: 12px; color: #7A7899; }

        /* ════════════════════════════════════
           반응형
        ════════════════════════════════════ */
        @media (max-width: 680px) {
            .page-hero { padding: 36px 20px 26px; }
            .hero-title { font-size: 26px; }
            .search-zone { padding: 0 16px 8px; }
            .results-zone { padding: 0 16px; }
            .best-zone-inner { padding: 0 16px; }
            .best-card { width: 128px; }
            .best-card-img { height: 180px; }
            .best-rank-num { font-size: 28px; }
            .bslider.prev { left: -10px; }
            .bslider.next { right: -10px; }
        }
        @media (max-width: 400px) {
            .hero-title { font-size: 22px; }
            .best-card { width: 112px; }
            .best-card-img { height: 158px; }
        }
    </style>
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<!-- ════ [1] 히어로 감성 문구 ════ -->
<section class="page-hero">
    <div class="hero-kicker">📖 FROM 독서 플랫폼</div>
    <h1 class="hero-title">오늘 어떤 이야기를<br>읽고 싶나요?</h1>
    <p class="hero-sub">당신만의 책을 찾아, 기록하고, 나누어보세요.</p>
</section>

<!-- ════ 검색 영역 ════ -->
<div class="search-zone">
    <div class="search-wrap" id="search-wrap">

        <!-- 검색바 -->
        <div class="search-bar">
            <select class="search-type" id="search-type">
                <option value="Keyword">통합검색</option>
                <option value="Title">제목</option>
                <option value="Author">저자</option>
            </select>
            <div class="search-divider"></div>
            <input type="text" id="search-input" class="search-input"
                   placeholder="책 제목, 저자를 검색해보세요."
                   autocomplete="off"
                   onfocus="openDropdown()"
                   onkeydown="if(event.key==='Enter') doSearch()">
            <button class="search-btn" onclick="doSearch()">🔍</button>
        </div>

        <!-- 드롭다운 (최근검색 + 추천키워드) -->
        <div class="search-dropdown" id="search-dropdown">

            <!-- [3] 최근 검색어 — 최대 5개, 컴팩트 -->
            <div class="dd-sec">
                <div class="dd-label">
                    최근 검색어
                    <span class="dd-clear" onclick="clearAllRecent()">전체 삭제</span>
                </div>
                <div id="recent-container">
                    <div class="recent-empty">최근 검색어가 없습니다.</div>
                </div>
            </div>

            <!-- [4] 추천 키워드 — pill 디자인 -->
            <div class="dd-sec">
                <div class="dd-label">추천 검색어</div>
                <div class="suggest-tags" id="suggest-tags"></div>
            </div>

            <div class="dd-footer">
                <button class="dd-close" onclick="closeDropdown()">닫기</button>
            </div>
        </div>
    </div>

    <!-- [7] FROM 브랜드 카피 -->
    <div class="brand-copy">
        책을 읽고,<br>당신만의 이야기를 남겨보세요.
    </div>
</div>

<!-- ════ 검색 결과 ════ -->
<div class="results-zone" id="results-zone">
    <div class="results-bar">
        <div class="results-label" id="results-label">검색 결과</div>
        <button class="results-back" onclick="showBest()">← 베스트셀러로</button>
    </div>
    <div class="book-list" id="book-list"></div>
</div>

<!-- ════ [2] 베스트셀러 — 넷플릭스 스타일 메인 섹션 ════ -->
<section class="best-zone" id="best-zone">
    <div class="best-zone-inner">

        <div class="best-zone-header">
            <div>
                <div class="best-zone-title">지금 베스트셀러</div>
                <div class="best-zone-sub">알라딘 실시간 인기 도서 TOP 10</div>
            </div>
            <div class="best-live-badge">
                <span class="live-dot"></span>실시간
            </div>
        </div>

        <div class="best-scroll-area">
            <button class="bslider prev" onclick="slideLeft()">&#8249;</button>
            <div class="best-scroll" id="best-list">
                <div class="best-loading">
                    <div class="ld"></div><div class="ld"></div><div class="ld"></div>
                    <span>불러오는 중...</span>
                </div>
            </div>
            <button class="bslider next" onclick="slideRight()">&#8250;</button>
        </div>

    </div>
</section>

<!-- 등록 완료 모달 -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <p id="modal-msg">등록되었습니다.</p>
        <div style="display:flex;gap:10px;margin-top:4px;">
            <button class="btn btn-primary" id="modal-review-btn" onclick="openReviewModal()" style="flex:1;">✍️ 후기 남기기</button>
            <button class="btn" onclick="closeModal()" style="flex:1;border:1.5px solid #ddd;color:#888;">취소</button>
        </div>
    </div>
</div>

<!-- 후기 작성 모달 -->
<div class="modal-overlay" id="review-modal">
    <div class="modal-box" style="max-width:380px;">
        <p style="font-weight:700;font-size:16px;margin-bottom:6px;">📝 후기 남기기</p>
        <p id="review-book-title" style="font-size:13px;color:#888;margin-bottom:16px;"></p>
        <div id="star-row" style="display:flex;gap:6px;justify-content:center;margin-bottom:6px;font-size:30px;cursor:pointer;">
            <span data-v="1">☆</span><span data-v="2">☆</span><span data-v="3">☆</span><span data-v="4">☆</span><span data-v="5">☆</span>
        </div>
        <div id="review-rating-error" style="display:none;color:#e74c3c;font-size:12px;text-align:center;margin-bottom:8px;"></div>
        <textarea id="review-content" class="form-control" rows="3" maxlength="300"
                  placeholder="한 줄 후기를 남겨보세요. (선택, 최대 300자)"
                  style="resize:vertical;font-size:14px;margin-bottom:12px;"></textarea>
        <div style="display:flex;gap:10px;">
            <button class="btn btn-primary" id="review-submit-btn" onclick="submitReview()" style="flex:1;">등록</button>
            <button class="btn" onclick="closeReviewModal()" style="flex:1;border:1.5px solid #ddd;color:#888;">취소</button>
        </div>
    </div>
</div>

<!-- FROM Toast -->
<div id="from-toast"></div>

<!-- 후기 보기 모달 -->
<div class="modal-overlay" id="ratings-modal">
    <div class="modal-box" style="max-width:420px;">
        <p style="font-weight:700;font-size:16px;margin-bottom:4px;">💬 독자 후기</p>
        <p id="ratings-book-title" style="font-size:13px;color:#888;margin-bottom:16px;"></p>
        <div id="ratings-list" style="max-height:300px;overflow-y:auto;"></div>
        <button class="btn btn-primary" onclick="closeRatingsModal()" style="width:100%;margin-top:14px;">닫기</button>
    </div>
</div>

<script>
    const SUGGEST_KEYWORDS = ['소설', '자기계발', '에세이', '역사', '과학', '철학', '심리학', '경제경영', '판타지', '시집'];
    const MAX_RECENT = 5;

    /* ── localStorage ── */
    function getRecent() { return JSON.parse(localStorage.getItem('book_recent') || '[]'); }
    function saveRecent(keyword) {
        let list = getRecent().filter(k => k !== keyword);
        list.unshift(keyword);
        if (list.length > MAX_RECENT) list = list.slice(0, MAX_RECENT);
        localStorage.setItem('book_recent', JSON.stringify(list));
        renderRecent();
    }
    function removeRecent(keyword, e) {
        e.stopPropagation();
        const list = getRecent().filter(k => k !== keyword);
        localStorage.setItem('book_recent', JSON.stringify(list));
        renderRecent();
    }
    function clearAllRecent() {
        localStorage.removeItem('book_recent');
        renderRecent();
    }

    /* ── 렌더링 ── */
    function renderRecent() {
        const recent = getRecent().slice(0, 5);
        const el = document.getElementById('recent-container');
        if (!recent.length) {
            el.innerHTML = '<div class="recent-empty">최근 검색어가 없습니다.</div>';
            return;
        }
        el.innerHTML = `<div class="recent-list">${recent.map(k => `
            <div class="recent-item" onclick="clickKeyword('${k.replace(/'/g,"\\'")}')">
                <span class="recent-left">
                    <span class="recent-clock">🕐</span>${k}
                </span>
                <span class="recent-del" onclick="removeRecent('${k.replace(/'/g,"\\'")}',event)">✕</span>
            </div>`).join('')}</div>`;
    }

    function renderSuggest() {
        document.getElementById('suggest-tags').innerHTML =
            SUGGEST_KEYWORDS.map(k => `<span class="suggest-tag" onclick="clickKeyword('${k}')">${k}</span>`).join('');
    }

    /* ── [2] 베스트셀러 렌더링 — 넷플릭스 카드 ── */
    function renderBest(books) {
        const list = document.getElementById('best-list');
        if (!books || !books.length) {
            list.innerHTML = '<div style="font-size:14px;color:#AAAABC;padding:20px 0">베스트 정보를 불러올 수 없습니다.</div>';
            return;
        }
        list.innerHTML = books.slice(0, 10).map((book, i) => {
            const t = (book.title||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');
            const a = (book.author||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');
            const c = (book.cover||'').replace(/"/g,'&quot;');
            const d = (book.description||'').replace(/"/g,'&quot;');
            const g = (book.category||'').replace(/"/g,'&quot;');
            return `
            <div class="best-card">
                <div class="best-card-img" onclick="clickKeyword('${t}')" style="cursor:pointer;">
                    ${book.cover
                        ? `<img src="${book.cover}" alt="표지" loading="lazy"
                             onerror="this.style.display='none';this.parentElement.querySelector('.best-overlay').insertAdjacentHTML('beforebegin','<div class=\\'best-placeholder\\'>📚</div>')">`
                        : `<div class="best-placeholder">📚</div>`}
                    <div class="best-overlay">
                        <span class="best-rank-num ${i < 3 ? 'top3' : ''}">${i + 1}</span>
                    </div>
                </div>
                <div class="best-card-title">${book.title}</div>
                <button class="register-btn"
                    style="width:100%;margin-top:6px;padding:6px 0;font-size:12px;"
                    data-title="${t}" data-author="${a}" data-cover="${c}"
                    data-description="${d}" data-category="${g}"
                    onclick="registerBook(this)">+ 등록</button>
            </div>`;
        }).join('');
    }

    /* ── 베스트셀러 로드 (페이지 로드 시 즉시) ── */
    function loadBest() {
        fetch('/book/bestseller')
            .then(r => r.json())
            .then(books => renderBest(books))
            .catch(() => renderBest(null));
    }

    /* ── 슬라이더 ── */
    function slideLeft()  { document.getElementById('best-list').scrollBy({ left: -340, behavior: 'smooth' }); }
    function slideRight() { document.getElementById('best-list').scrollBy({ left:  340, behavior: 'smooth' }); }

    /* ── 드롭다운 ── */
    function openDropdown() {
        document.getElementById('search-dropdown').classList.add('open');
        renderRecent();
    }
    function closeDropdown() {
        document.getElementById('search-dropdown').classList.remove('open');
    }
    document.addEventListener('click', e => {
        if (!document.getElementById('search-wrap').contains(e.target)) closeDropdown();
    });

    /* ── 검색 ── */
    function clickKeyword(keyword) {
        document.getElementById('search-input').value = keyword;
        doSearch();
    }

    function doSearch() {
        const query = document.getElementById('search-input').value.trim();
        if (!query) return;
        const type = document.getElementById('search-type').value;

        saveRecent(query);
        closeDropdown();

        // 결과 영역 표시, 베스트셀러 숨김
        document.getElementById('results-zone').style.display = 'block';
        document.getElementById('best-zone').style.display    = 'none';
        document.getElementById('results-label').innerHTML    = `<strong>"${query}"</strong> 검색 결과`;
        document.getElementById('book-list').innerHTML        =
            '<p style="text-align:center;color:#AAAABC;padding:36px 0;font-size:14px;">검색 중...</p>';

        fetch(`/book/search?query=${encodeURIComponent(query)}&type=${encodeURIComponent(type)}`)
            .then(r => r.json())
            .then(books => {
                const list = document.getElementById('book-list');
                if (!books || !books.length) {
                    list.innerHTML = '<p style="text-align:center;color:#AAAABC;padding:52px 0;font-size:14px;">검색 결과가 없습니다.</p>';
                    return;
                }
                list.innerHTML = books.map(book => {
                    const t = (book.title||'').replace(/"/g,'&quot;').replace(/'/g,"\\'");
                    const a = (book.author||'').replace(/"/g,'&quot;').replace(/'/g,"\\'");
                    return `
                    <div class="book-item" style="flex-wrap:wrap;">
                        ${book.cover
                            ? `<img src="${book.cover}" class="book-cover-sm" alt="표지">`
                            : `<div class="book-cover-placeholder-sm">📚</div>`}
                        <div class="book-info">
                            <div class="book-title">${book.title}</div>
                            <div class="book-author">${book.author || ''}</div>
                            <button onclick="showRatings('${t}','${a}')"
                                style="background:none;border:none;font-size:12px;color:#6071E3;cursor:pointer;padding:4px 0 0;font-family:inherit;">
                                💬 후기 보기</button>
                        </div>
                        <button class="register-btn"
                            data-title="${(book.title||'').replace(/"/g,'&quot;')}"
                            data-author="${(book.author||'').replace(/"/g,'&quot;')}"
                            data-cover="${(book.cover||'').replace(/"/g,'&quot;')}"
                            data-description="${(book.description||'').replace(/"/g,'&quot;')}"
                            data-category="${(book.category||'').replace(/"/g,'&quot;')}"
                            onclick="registerBook(this)">등록하기</button>
                    </div>`;
                }).join('');
            });
    }

    function showBest() {
        document.getElementById('results-zone').style.display = 'none';
        document.getElementById('best-zone').style.display    = 'block';
        document.getElementById('search-input').value         = '';
    }

    /* ── Toast ── */
    function showToast(title, sub) {
        const t = document.getElementById('from-toast');
        t.innerHTML = `<div class="toast-title">${title}</div>${sub ? `<div class="toast-sub">${sub}</div>` : ''}`;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 2400);
    }

    /* ── 책 등록 ── */
    let currentBookId = null;
    let currentBookTitle = '';
    let currentBookAuthor = '';

    function registerBook(btn) {
        fetch('/book/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: [
                'title='       + encodeURIComponent(btn.dataset.title),
                'author='      + encodeURIComponent(btn.dataset.author),
                'cover='       + encodeURIComponent(btn.dataset.cover),
                'description=' + encodeURIComponent(btn.dataset.description),
                'category='    + encodeURIComponent(btn.dataset.category),
            ].join('&')
        })
        .then(r => r.json())
        .then(data => {
            currentBookId     = data.bookId || null;
            currentBookTitle  = btn.dataset.title  || '';
            currentBookAuthor = btn.dataset.author || '';
            const msg = data.msg || '등록되었습니다.';
            document.getElementById('modal-msg').textContent = msg;
            document.getElementById('modal-review-btn').style.display =
                currentBookId ? 'block' : 'none';
            document.getElementById('modal').classList.add('show');
        });
    }

    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    /* ── 후기 작성 ── */
    let selectedRating = 0;

    function openReviewModal() {
        closeModal();
        if (!currentBookId) return;
        selectedRating = 0;
        document.getElementById('review-content').value = '';
        document.getElementById('review-book-title').textContent = currentBookTitle;
        document.getElementById('review-rating-error').style.display = 'none';
        renderStars(0);
        document.getElementById('review-modal').classList.add('show');
    }

    function closeReviewModal() { document.getElementById('review-modal').classList.remove('show'); }

    function renderStars(val) {
        document.querySelectorAll('#star-row span').forEach((s, i) => {
            s.textContent = i < val ? '★' : '☆';
            s.style.color  = i < val ? '#f59e0b' : '#ccc';
        });
    }

    document.querySelectorAll('#star-row span').forEach(s => {
        s.addEventListener('click', () => {
            selectedRating = parseInt(s.dataset.v);
            renderStars(selectedRating);
            document.getElementById('review-rating-error').style.display = 'none';
        });
        s.addEventListener('mouseover', () => renderStars(parseInt(s.dataset.v)));
        s.addEventListener('mouseout',  () => renderStars(selectedRating));
    });

    function submitReview() {
        if (selectedRating === 0) {
            const err = document.getElementById('review-rating-error');
            err.textContent = '⭐ 별점을 선택해주세요.';
            err.style.display = 'block';
            return;
        }
        if (!currentBookId) { closeReviewModal(); return; }

        const btn = document.getElementById('review-submit-btn');
        btn.disabled = true;
        btn.textContent = '등록 중...';

        fetch('/book/rating', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: [
                'bookId='  + encodeURIComponent(currentBookId),
                'rating='  + selectedRating,
                'content=' + encodeURIComponent(document.getElementById('review-content').value.trim()),
            ].join('&')
        })
        .then(r => r.json())
        .then(data => {
            btn.disabled = false;
            btn.textContent = '등록';
            closeReviewModal();
            if (data.result === 1) {
                showToast('📖 후기 등록 완료', '독서 기록이 저장되었습니다.');
                setTimeout(() => showRatings(currentBookTitle, currentBookAuthor), 500);
            } else {
                showToast('⚠️ ' + (data.msg || '등록에 실패했습니다.'), '');
            }
        })
        .catch(() => {
            btn.disabled = false;
            btn.textContent = '등록';
            closeReviewModal();
            showToast('⚠️ 오류가 발생했습니다.', '잠시 후 다시 시도해주세요.');
        });
    }

    /* ── 후기 보기 + 좋아요 + 댓글 ── */
    function showRatings(title, author) {
        document.getElementById('ratings-book-title').textContent = title;
        document.getElementById('ratings-list').innerHTML =
            '<p style="text-align:center;color:#ccc;padding:20px 0;">불러오는 중...</p>';
        document.getElementById('ratings-modal').classList.add('show');
        fetch(`/book/ratings?title=${encodeURIComponent(title)}&author=${encodeURIComponent(author)}`)
            .then(r => r.json())
            .then(list => {
                const el = document.getElementById('ratings-list');
                if (!list || !list.length) {
                    el.innerHTML = '<p style="text-align:center;color:#bbb;padding:20px 0;">아직 후기가 없습니다.</p>';
                    return;
                }
                const avg = (list.reduce((s, r) => s + r.rating, 0) / list.length).toFixed(1);
                el.innerHTML =
                    `<p style="text-align:center;font-size:22px;font-weight:700;color:#f59e0b;margin-bottom:12px;">
                        ${'★'.repeat(Math.round(avg))}${'☆'.repeat(5-Math.round(avg))} ${avg}
                        <span style="font-size:13px;color:#999;font-weight:400;">(${list.length}명)</span>
                    </p>` +
                    list.map(r => `
                    <div id="review-card-${r.id}" style="border-top:1px solid #EEEEF8;padding:12px 4px;">
                        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
                            <div style="width:36px;height:36px;border-radius:50%;background:#f0f0ff;border:2px solid #E4E1F0;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;">
                                ${r.profileImageUrl ? `<img src="${r.profileImageUrl}" style="width:100%;height:100%;object-fit:cover;">` : '📖'}
                            </div>
                            <div style="flex:1;">
                                <span style="font-size:13px;font-weight:700;color:#333;">${r.displayName || r.userId}</span>
                                <span style="font-size:12px;color:#bbb;margin-left:8px;">${r.createdAt}</span>
                            </div>
                        </div>
                        <div style="font-size:15px;color:#f59e0b;margin-bottom:6px;">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
                        ${r.content ? `<div style="font-size:13px;color:#555;line-height:1.6;margin-bottom:8px;">${r.content}</div>` : ''}
                        <div style="display:flex;align-items:center;gap:14px;">
                            <button id="like-btn-${r.id}" onclick="toggleLike(${r.id})"
                                style="background:none;border:none;cursor:pointer;font-size:13px;color:${r.liked ? '#e74c3c' : '#bbb'};padding:0;font-family:inherit;">
                                ${r.liked ? '❤️' : '🤍'} <span id="like-count-${r.id}">${r.likeCount}</span>
                            </button>
                            <button onclick="toggleComments(${r.id})"
                                style="background:none;border:none;cursor:pointer;font-size:13px;color:#6071E3;padding:0;font-family:inherit;">
                                💬 댓글 <span id="comment-count-${r.id}">${r.commentCount}</span>개
                            </button>
                        </div>
                        <div id="comments-${r.id}" style="display:none;margin-top:10px;background:#fafafa;border-radius:8px;padding:10px;">
                            <div id="comment-list-${r.id}" style="margin-bottom:8px;"></div>
                            <div style="display:flex;gap:6px;">
                                <input id="comment-input-${r.id}" type="text" maxlength="200"
                                    placeholder="댓글을 입력하세요..."
                                    style="flex:1;padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:12px;font-family:inherit;"
                                    onkeydown="if(event.key==='Enter') submitComment(${r.id})">
                                <button onclick="submitComment(${r.id})"
                                    style="padding:7px 12px;background:#6071E3;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;">
                                    등록
                                </button>
                            </div>
                        </div>
                    </div>`).join('');
            });
    }

    function toggleLike(ratingId) {
        fetch(`/book/rating/${ratingId}/like`, { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                const btn = document.getElementById(`like-btn-${ratingId}`);
                document.getElementById(`like-count-${ratingId}`).textContent = data.count;
                btn.innerHTML = `${data.liked ? '❤️' : '🤍'} <span id="like-count-${ratingId}">${data.count}</span>`;
                btn.style.color = data.liked ? '#e74c3c' : '#bbb';
            });
    }

    function toggleComments(ratingId) {
        const el = document.getElementById(`comments-${ratingId}`);
        const showing = el.style.display !== 'none';
        el.style.display = showing ? 'none' : 'block';
        if (!showing) loadComments(ratingId);
    }

    function loadComments(ratingId) {
        fetch(`/book/rating/${ratingId}/comments`)
            .then(r => r.json())
            .then(list => {
                const el = document.getElementById(`comment-list-${ratingId}`);
                el.innerHTML = list.length ? list.map(c => `
                    <div style="padding:5px 0;border-bottom:1px solid #eee;font-size:12px;">
                        <span style="font-weight:600;color:#555;">${c.userId}</span>
                        <span style="color:#bbb;margin:0 4px;">${c.createdAt}</span><br>
                        <span style="color:#333;">${c.content}</span>
                    </div>`).join('') :
                    '<p style="font-size:12px;color:#bbb;text-align:center;">아직 댓글이 없습니다.</p>';
            });
    }

    function submitComment(ratingId) {
        const input = document.getElementById(`comment-input-${ratingId}`);
        const content = input.value.trim();
        if (!content) return;
        fetch(`/book/rating/${ratingId}/comment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'content=' + encodeURIComponent(content)
        })
        .then(r => r.json())
        .then(data => {
            if (data.result === 1) {
                input.value = '';
                loadComments(ratingId);
                const countEl = document.getElementById(`comment-count-${ratingId}`);
                if (countEl) countEl.textContent = parseInt(countEl.textContent) + 1;
            }
        });
    }

    function closeRatingsModal() { document.getElementById('ratings-modal').classList.remove('show'); }

    /* ── 초기화 ── */
    renderSuggest();
    loadBest();
</script>
</body>
</html>
