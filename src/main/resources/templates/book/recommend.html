<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>책 추천 - FROM</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    :root {
      --blue:         #5b7cf8;
      --blue-dark:    #4a6be0;
      --blue-light:   #eef1fe;
      --purple:       #7c3aed;
      --purple-light: #f5f3ff;
      --bg:           #f5f6fa;
      --white:        #ffffff;
      --border:       #e4e7f0;
      --text:         #1a1d2e;
      --text2:        #6b7280;
      --text3:        #adb5c9;
      --radius:       14px;
      --shadow:       0 2px 12px rgba(91,124,248,.08);
      --shadow-md:    0 6px 24px rgba(91,124,248,.14);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Jua', sans-serif;
      min-height: 100vh;
    }

    /* ══════════════════════ 히어로 ══════════════════════ */
    .hero {
      background: linear-gradient(135deg,#eef1fe 0%,#e8edff 55%,#f5f6fa 100%);
      border-bottom: 1px solid var(--border);
      padding: 42px 24px 36px;
    }
    .hero-inner {
      max-width: 1060px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--blue-light);
      color: var(--blue);
      border: 1px solid rgba(91,124,248,.22);
      border-radius: 99px;
      padding: 4px 13px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .hero-title {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .hero-title span { color: var(--blue); }
    .hero-desc { font-size: 14px; color: var(--text2); line-height: 1.75; }
    .hero-emoji {
      font-size: 64px;
      flex-shrink: 0;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }

    /* ══════════════════════ 래퍼 ══════════════════════ */
    .page-wrap {
      max-width: 1060px;
      margin: 0 auto;
      padding: 30px 24px 72px;
    }

    /* ══════════════════════ [1] AI 분석 카드 ══════════════════════ */
    .analysis-card {
      display: none;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg,#eef1fe 0%,#f0ecff 100%);
      border: 1px solid rgba(91,124,248,.18);
      border-radius: 18px;
      padding: 24px 28px;
      margin-bottom: 30px;
      box-shadow: 0 2px 18px rgba(91,124,248,.1);
    }
    /* 배경 원형 장식 */
    .analysis-card::before,
    .analysis-card::after {
      content:'';
      position:absolute;
      border-radius:50%;
      pointer-events:none;
    }
    .analysis-card::before {
      width:150px; height:150px;
      right:-30px; top:-30px;
      background:rgba(91,124,248,.07);
    }
    .analysis-card::after {
      width:80px; height:80px;
      right:50px; top:40px;
      background:rgba(124,58,237,.06);
    }

    .analysis-inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }
    .analysis-bot {
      font-size: 38px;
      flex-shrink: 0;
      margin-top: 2px;
      filter: drop-shadow(0 2px 4px rgba(91,124,248,.2));
    }
    .analysis-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    .analysis-sentence {
      font-size: 15px;
      color: var(--text);
      line-height: 1.8;
    }
    .analysis-sentence strong { color: var(--blue); }

    /* ══════════════════════ 로딩 ══════════════════════ */
    .loading-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 90px 0;
      gap: 14px;
    }
    .loading-wrap.hidden { display: none; }
    .spinner {
      width: 46px; height: 46px;
      border: 4px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg) } }
    .loading-text { font-size: 15px; color: var(--text2); }
    .loading-sub  { font-size: 13px; color: var(--text3); margin-top:-2px; }

    /* ══════════════════════ 빈 상태 ══════════════════════ */
    .empty-wrap { text-align:center; padding:90px 24px; }
    .empty-wrap.hidden { display:none; }
    .empty-emoji { font-size:52px; margin-bottom:16px; }
    .empty-wrap p { font-size:14px; color:var(--text2); line-height:1.8; margin-bottom:20px; }
    .empty-link {
      display:inline-block;
      padding:10px 26px;
      background:var(--blue);
      color:white;
      border-radius:10px;
      font-size:14px;
      font-weight:700;
      text-decoration:none;
      transition:background .2s;
    }
    .empty-link:hover { background:var(--blue-dark); }

    /* ══════════════════════ [3] 섹션 바 ══════════════════════ */
    #sectionsContainer { display:none; }
    .rec-section { margin-bottom: 48px; }

    .section-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 0 0 16px;
      border-left: 4px solid var(--blue);
      margin-bottom: 20px;
    }
    .section-bar.category-bar { border-left-color: var(--purple); }
    .section-icon  { font-size:18px; line-height:1; }
    .section-label { font-size:17px; font-weight:700; flex:1; }
    .section-chip  { padding:3px 10px; border-radius:99px; font-size:11px; font-weight:700; }
    .author-chip   { background:var(--blue-light);  color:var(--blue);   }
    .category-chip { background:var(--purple-light); color:var(--purple); }
    .section-count { font-size:12px; color:var(--text3); }

    /* ══════════════════════ [6] 책 그리드 ══════════════════════ */
    .book-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 20px;
    }

    /* ══════════════════════ [2][3] 책 카드 ══════════════════════ */
    .book-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: transform .22s, box-shadow .22s, border-color .22s;
      animation: fadeUp .38s ease both;
    }
    .book-card.is-author:hover   { transform:translateY(-5px); box-shadow:var(--shadow-md); border-color:var(--blue);   }
    .book-card.is-category:hover { transform:translateY(-5px); box-shadow:0 6px 24px rgba(124,58,237,.14); border-color:var(--purple); }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* 표지 */
    .book-cover {
      width:100%; height:190px;
      overflow:hidden; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:52px;
    }
    .book-cover img {
      width:100%; height:100%;
      object-fit:cover; display:block;
      transition:transform .32s ease;
    }
    .book-card:hover .book-cover img { transform:scale(1.06); }

    /* 카드 바디 */
    .book-body {
      padding: 14px 14px 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* [3] 구체적 추천 이유 배지 */
    .reason-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 9px;
      align-self: flex-start;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .author-reason   { background:var(--blue-light);  color:var(--blue);   }
    .category-reason { background:var(--purple-light); color:var(--purple); }

    /* 제목·저자 */
    .book-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 3px;
    }
    .book-author {
      font-size: 12px;
      color: var(--text3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }

    /* [2] 한 줄 요약 */
    .book-oneliner {
      font-size: 12px;
      color: var(--text2);
      line-height: 1.6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 10px;
    }

    /* [2] 해시태그 */
    .book-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 14px;
    }
    .htag {
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      background: var(--bg);
      color: var(--text2);
      border: 1px solid var(--border);
    }

    /* [4] 카드 액션 버튼 행 */
    .card-actions {
      display: flex;
      gap: 7px;
      margin-top: auto;
    }

    /* "왜 추천됐나요?" 버튼 */
    .why-btn {
      flex: 1;
      padding: 8px 4px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Jua', sans-serif;
      transition: all .2s;
      border: 1.5px solid var(--border);
      background: white;
      color: var(--text2);
      white-space: nowrap;
    }
    .why-btn:hover { border-color:var(--blue); color:var(--blue); background:var(--blue-light); }

    /* 담기 버튼 */
    .reg-btn {
      flex: 1;
      padding: 8px 4px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Jua', sans-serif;
      transition: all .2s;
      white-space: nowrap;
    }
    .reg-btn.author-btn   { border:1.5px solid var(--blue);   background:white; color:var(--blue);   }
    .reg-btn.category-btn { border:1.5px solid var(--purple);  background:white; color:var(--purple); }
    .reg-btn.author-btn:hover   { background:var(--blue-light);   }
    .reg-btn.category-btn:hover { background:var(--purple-light);  }
    .reg-btn.saved   { opacity:.65; cursor:not-allowed; }
    .reg-btn:disabled { opacity:.6;  cursor:not-allowed; }

    /* ══════════════════════ [4] 왜 추천됐나요? 모달 ══════════════════════ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(5px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s, visibility .25s;
    }
    .modal-overlay.show { opacity:1; visibility:visible; }

    .why-modal {
      background: white;
      border-radius: 20px;
      max-width: 448px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(24px) scale(.97);
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
      box-shadow: 0 24px 64px rgba(0,0,0,.18);
    }
    .modal-overlay.show .why-modal { transform:translateY(0) scale(1); }

    /* 모달 헤더 */
    .modal-head {
      background: linear-gradient(135deg,var(--blue-light) 0%,var(--purple-light) 100%);
      padding: 22px 24px 18px;
      border-radius: 20px 20px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .modal-head-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .modal-head-sub   { font-size: 12px; color: var(--text2); }
    .modal-x {
      background: rgba(255,255,255,.8);
      border: none;
      border-radius: 50%;
      width: 30px; height: 30px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text3);
      flex-shrink: 0;
      transition: color .15s, background .15s;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .modal-x:hover { color:var(--text); background:white; }

    /* 모달 책 정보 행 */
    .modal-book {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 20px 24px 18px;
      border-bottom: 1px solid var(--border);
    }
    .modal-thumb {
      width: 58px; height: 80px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    .modal-thumb img { width:100%; height:100%; object-fit:cover; }
    .modal-book-title  { font-size:14px; font-weight:700; line-height:1.4; margin-bottom:4px; }
    .modal-book-author { font-size:12px; color:var(--text3); }

    /* 모달 본문 */
    .modal-body { padding: 18px 24px 0; }

    .msec { margin-bottom: 18px; }
    .msec-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text3);
      letter-spacing: .05em;
      text-transform: uppercase;
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .msec-text { font-size: 13px; color: var(--text2); line-height: 1.7; }

    .modal-tags { display:flex; flex-wrap:wrap; gap:6px; }
    .modal-tag {
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      background: var(--blue-light);
      color: var(--blue);
    }

    /* 추천 메시지 박스 */
    .rec-msg {
      background: linear-gradient(135deg,var(--blue-light) 0%,var(--purple-light) 100%);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.8;
    }

    /* 모달 푸터 */
    .modal-footer { padding: 18px 24px 24px; }
    .modal-ok {
      width: 100%;
      padding: 12px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Jua', sans-serif;
      transition: background .2s;
    }
    .modal-ok:hover { background:var(--blue-dark); }

    /* ══════════════════════ 토스트 ══════════════════════ */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1a1d2e;
      color: white;
      padding: 12px 24px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      transition: all .3s ease;
      z-index: 600;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ══════════════════════ 반응형 ══════════════════════ */
    @media (max-width:820px) {
      .book-grid { grid-template-columns:repeat(2,1fr); gap:16px; }
      .hero-emoji { display:none; }
    }
    @media (max-width:640px) {
      .hero { padding:28px 16px 22px; }
      .hero-title { font-size:22px; }
      .page-wrap { padding:22px 16px 56px; }
      .book-grid { grid-template-columns:repeat(2,1fr); gap:12px; }
      .book-cover { height:155px; }
      .book-body { padding:10px 10px 12px; }
    }
    @media (max-width:480px) {
      .card-actions { flex-direction:column; gap:6px; }
    }
    @media (max-width:380px) {
      .book-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<div th:replace="~{layout/navbar :: navbar}"></div>

<!-- ── 히어로 ── -->
<div class="hero">
  <div class="hero-inner">
    <div>
      <div class="hero-kicker">✨ AI 독서 분석</div>
      <h1 class="hero-title">나를 위한 <span>맞춤 추천</span></h1>
      <p class="hero-desc">
        즐겨 읽은 작가와 선호 장르를 분석해<br>
        지금 당신에게 딱 맞는 책을 추천해드려요.
      </p>
    </div>
    <div class="hero-emoji">📚</div>
  </div>
</div>

<div class="page-wrap">

  <!-- ── [1] AI 분석 카드 ── -->
  <div class="analysis-card" id="analysisCard">
    <div class="analysis-inner">
      <div class="analysis-bot">🤖</div>
      <div>
        <div class="analysis-label">FROM AI 분석 완료</div>
        <div class="analysis-sentence" id="analysisSentence"></div>
      </div>
    </div>
  </div>

  <!-- ── 로딩 ── -->
  <div class="loading-wrap" id="loadingWrap">
    <div class="spinner"></div>
    <div class="loading-text">독서 이력 분석 중...</div>
    <div class="loading-sub">잠시만 기다려 주세요</div>
  </div>

  <!-- ── 빈 상태 ── -->
  <div class="empty-wrap hidden" id="emptyWrap">
    <div class="empty-emoji">📖</div>
    <p>추천을 받으려면 먼저 책을 등록해야 해요.<br>책 등록 후 다시 시도해주세요!</p>
    <a th:href="@{/book/register}" class="empty-link">책 등록하러 가기</a>
  </div>

  <!-- ── 섹션 컨테이너 ── -->
  <div id="sectionsContainer"></div>

</div>

<!-- ── [4] 왜 추천됐나요? 모달 ── -->
<div class="modal-overlay" id="whyOverlay" onclick="handleOverlayClick(event)">
  <div class="why-modal">

    <div class="modal-head">
      <div>
        <div class="modal-head-title">📊 이 책이 추천된 이유</div>
        <div class="modal-head-sub">FROM AI 분석 결과</div>
      </div>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>

    <!-- 책 썸네일 + 제목 -->
    <div class="modal-book">
      <div class="modal-thumb" id="modalThumb"></div>
      <div>
        <div class="modal-book-title"  id="modalTitle"></div>
        <div class="modal-book-author" id="modalAuthor"></div>
      </div>
    </div>

    <div class="modal-body">

      <!-- 추천 기준 -->
      <div class="msec">
        <div class="msec-label">🎯 추천 기준</div>
        <div class="msec-text" id="modalCriteria"></div>
      </div>

      <!-- 관련 키워드 -->
      <div class="msec">
        <div class="msec-label">🏷️ 관련 키워드</div>
        <div class="modal-tags" id="modalTags"></div>
      </div>

      <!-- FROM 추천 메시지 -->
      <div class="msec">
        <div class="msec-label">💬 FROM의 추천 메시지</div>
        <div class="rec-msg" id="modalMsg"></div>
      </div>

    </div>

    <div class="modal-footer">
      <button class="modal-ok" onclick="closeModal()">확인했어요</button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ── 폴백 이모지 ── */
  const FB = [
    {e:'🌊', bg:'linear-gradient(135deg,#e0f2fe,#bae6fd)'},
    {e:'🌙', bg:'linear-gradient(135deg,#ede9fe,#ddd6fe)'},
    {e:'🔥', bg:'linear-gradient(135deg,#fef3c7,#fde68a)'},
    {e:'🌿', bg:'linear-gradient(135deg,#d1fae5,#a7f3d0)'},
    {e:'⭐', bg:'linear-gradient(135deg,#fff7ed,#fed7aa)'},
    {e:'🎭', bg:'linear-gradient(135deg,#fce7f3,#fbcfe8)'},
    {e:'🏔️', bg:'linear-gradient(135deg,#e0e7ff,#c7d2fe)'},
    {e:'🦋', bg:'linear-gradient(135deg,#ecfdf5,#bbf7d0)'},
  ];

  const registered = new Set();

  /* HTML 이스케이프 */
  const esc = s => (s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  /* ── 토스트 ── */
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  /* ── 책 등록 ── */
  async function registerBook(key, book, btn) {
    if (registered.has(key)) { toast('이미 등록된 책이에요!'); return; }
    btn.disabled = true;
    btn.textContent = '등록 중...';
    try {
      const body = new URLSearchParams({
        title: book.title||'', author: book.author||'',
        cover: book.cover||'', description: book.description||'',
        category: book.category||'',
      });
      const res  = await fetch('/book/register', {method:'POST', body});
      const data = await res.json();
      if (data.result === 1 || (data.msg && data.msg.includes('이미'))) {
        registered.add(key);
        btn.textContent = '♥ 담김';
        btn.classList.add('saved');
        btn.disabled = true;
        toast(data.result === 1 ? '✅ 내 서재에 등록했어요!' : data.msg);
      } else {
        btn.disabled = false;
        btn.textContent = '♡ 담기';
        toast(data.msg || '오류가 발생했어요.');
      }
    } catch {
      btn.disabled = false;
      btn.textContent = '♡ 담기';
      toast('❌ 오류가 발생했어요.');
    }
  }

  /* ── 헬퍼: 작가명 / 카테고리명 추출 ── */
  const authorOf   = s => s.label.replace(' 작가의 다른 책','').trim();
  const categoryOf = s => s.label.replace(' 추천','').trim();

  /* ── 해시태그 생성 ── */
  function getHashtags(book, section) {
    const tags = new Set();
    if (book.category) {
      book.category.split('>').forEach(p => {
        const t = p.trim();
        if (t && t !== '국내도서' && t !== '외국도서') tags.add('#' + t);
      });
    }
    if (tags.size === 0) {
      tags.add('#' + (section.type === 'author' ? authorOf(section) : categoryOf(section)));
    }
    return [...tags].slice(0, 3);
  }

  /* ── [3] 구체적 추천 이유 배지 문구 ── */
  function reasonBadgeText(section) {
    return section.type === 'author'
      ? `✍️ '${authorOf(section)}' 팬에게 추천`
      : `📚 '${categoryOf(section)}' 관심 기반`;
  }

  /* ── 한 줄 요약 ── */
  function oneliner(book, section) {
    if (book.description) {
      const t = book.description.replace(/<[^>]+>/g,'').trim();
      return t.length > 52 ? t.slice(0, 50) + '…' : t;
    }
    return section.type === 'author'
      ? '같은 작가의 또 다른 매력적인 작품이에요.'
      : '해당 장르에서 주목받는 추천 도서예요.';
  }

  /* ── [4] 모달 열기 ── */
  function openModal(book, section) {
    const isAuthor = section.type === 'author';
    const keyName  = isAuthor ? authorOf(section) : categoryOf(section);
    const fbIdx    = Math.floor(Math.random() * FB.length);
    const fb       = FB[fbIdx];

    /* 책 썸네일 */
    const thumb = document.getElementById('modalThumb');
    if (book.cover) {
      thumb.style.background = '';
      thumb.innerHTML = `<img src="${esc(book.cover)}" alt=""
        onerror="this.parentElement.style.background='${fb.bg}';this.outerHTML='<span>${fb.e}</span>'">`;
    } else {
      thumb.style.background = fb.bg;
      thumb.innerHTML = `<span>${fb.e}</span>`;
    }

    document.getElementById('modalTitle').textContent  = book.title  || '';
    document.getElementById('modalAuthor').textContent = book.author || '';

    /* 추천 기준 */
    document.getElementById('modalCriteria').textContent = isAuthor
      ? `최근 '${keyName}' 작가의 책을 읽으신 독서 이력을 바탕으로 추천됐어요.`
      : `'${keyName}' 장르에 대한 지속적인 관심을 기반으로 추천됐어요.`;

    /* 키워드 태그 */
    const tags = getHashtags(book, section);
    document.getElementById('modalTags').innerHTML =
      tags.map(t => `<span class="modal-tag">${esc(t)}</span>`).join('');

    /* 추천 메시지 */
    document.getElementById('modalMsg').textContent = isAuthor
      ? `'${keyName}' 작가의 글쓰기 스타일과 세계관을 즐기시는군요! 같은 작가의 다른 작품들은 비슷한 깊이와 매력을 가지고 있어요. '${book.title}'은 그 중에서도 많은 독자들에게 사랑받는 작품이에요.`
      : `'${keyName}' 장르에 대한 관심이 높으시군요! 비슷한 취향의 독자들 사이에서 높은 평가를 받고 있는 도서예요. 새로운 시각과 풍부한 인사이트를 만나보세요.`;

    document.getElementById('whyOverlay').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('whyOverlay').classList.remove('show');
    document.body.style.overflow = '';
  }
  function handleOverlayClick(e) {
    if (e.target === document.getElementById('whyOverlay')) closeModal();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  /* ── 카드 빌드 ── */
  function buildCard(si, bi, section, book) {
    const isAuthor = section.type === 'author';
    const fb  = FB[(si * 8 + bi) % FB.length];
    const key = `${si}-${bi}`;

    const card = document.createElement('div');
    card.className = `book-card ${isAuthor ? 'is-author' : 'is-category'}`;
    card.style.animationDelay = `${bi * 0.06 + si * 0.08}s`;

    const coverHtml = book.cover
      ? `<img src="${esc(book.cover)}" alt="${esc(book.title)}"
           onerror="this.parentElement.style.background='${fb.bg}';this.outerHTML='<span>${fb.e}</span>'">`
      : `<span>${fb.e}</span>`;
    const coverBg  = book.cover ? '' : `background:${fb.bg}`;
    const badgeCls = isAuthor ? 'author-reason'   : 'category-reason';
    const btnCls   = isAuthor ? 'author-btn'       : 'category-btn';
    const hashtags = getHashtags(book, section);

    card.innerHTML = `
      <div class="book-cover" style="${coverBg}">${coverHtml}</div>
      <div class="book-body">
        <span class="reason-badge ${badgeCls}">${esc(reasonBadgeText(section))}</span>
        <div class="book-title">${esc(book.title)}</div>
        <div class="book-author">${esc(book.author || '')}</div>
        <div class="book-oneliner">${esc(oneliner(book, section))}</div>
        <div class="book-tags">
          ${hashtags.map(t => `<span class="htag">${esc(t)}</span>`).join('')}
        </div>
        <div class="card-actions">
          <button class="why-btn">🤔 왜 추천됐나요?</button>
          <button class="reg-btn ${btnCls}">♡ 담기</button>
        </div>
      </div>
    `;

    card.querySelector('.why-btn').addEventListener('click', () => openModal(book, section));
    card.querySelector('.reg-btn').addEventListener('click', function () {
      registerBook(key, book, this);
    });

    return card;
  }

  /* ── 섹션 빌드 ── */
  function buildSection(si, section) {
    const isAuthor = section.type === 'author';
    const wrap = document.createElement('div');
    wrap.className = 'rec-section';

    const bar = document.createElement('div');
    bar.className = `section-bar ${isAuthor ? '' : 'category-bar'}`;
    bar.innerHTML = `
      <span class="section-icon">${section.icon}</span>
      <span class="section-label">${esc(section.label)}</span>
      <span class="section-chip ${isAuthor ? 'author-chip' : 'category-chip'}">
        ${isAuthor ? '작가 기반' : '장르 기반'}
      </span>
      <span class="section-count">${section.books.length}권</span>
    `;

    const grid = document.createElement('div');
    grid.className = 'book-grid';
    section.books.forEach((book, bi) => grid.appendChild(buildCard(si, bi, section, book)));

    wrap.appendChild(bar);
    wrap.appendChild(grid);
    return wrap;
  }

  /* ── [1] 분석 문장 생성 ── */
  function buildSentence(sections) {
    const authors = sections
      .filter(s => s.type === 'author')
      .map(s => `<strong>'${esc(authorOf(s))}'</strong>`);

    const cats = sections
      .filter(s => s.type === 'category')
      .map(s => `<strong>'${esc(categoryOf(s))}'</strong>`);

    if (!authors.length && !cats.length)
      return '독서 이력을 분석해 맞춤 도서를 추천해드려요.';

    const parts = [];
    if (authors.length) parts.push(`최근 ${authors.join(', ')} 작가의 책을 읽으셨고`);
    if (cats.length)    parts.push(`${cats.join(', ')}에 관심이 있어요`);

    return '당신은 ' + parts.join(',<br>') + '.<br>이 데이터를 기반으로 맞춤 도서를 추천해드려요.';
  }

  /* ── 메인 ── */
  async function loadSections() {
    try {
      const res      = await fetch('/book/section-recommend');
      if (!res.ok)   throw new Error();
      const sections = await res.json();

      document.getElementById('loadingWrap').classList.add('hidden');

      if (!sections || sections.length === 0) {
        document.getElementById('emptyWrap').classList.remove('hidden');
        return;
      }

      /* 분석 카드 */
      document.getElementById('analysisSentence').innerHTML = buildSentence(sections);
      document.getElementById('analysisCard').style.display = 'block';

      /* 섹션 렌더 */
      const container = document.getElementById('sectionsContainer');
      container.style.display = 'block';
      sections.forEach((s, i) => container.appendChild(buildSection(i, s)));

    } catch {
      document.getElementById('loadingWrap').classList.add('hidden');
      document.getElementById('emptyWrap').classList.remove('hidden');
    }
  }

  loadSections();
</script>
</body>
</html>
